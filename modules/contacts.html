<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Contacts Directory - Operation Portal</title>
    <meta name="theme-color" content="#0e4261">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f2942 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Main App Frame */
        .app-shell {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            background-color: #f8fafc;
            min-height: 100vh;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
            display: flex;
            flex-direction: column;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        /* Top Dark Teal Header Banner */
        .top-banner {
            background: linear-gradient(90deg, #0e4261 0%, #13547a 55%, #186a99 100%);
            border-bottom: 3px solid #08283b;
            color: #ffffff;
            padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px 14px 18px;
            user-select: none;
        }

        /* Back to Portal Button */
        .btn-back-portal {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.28);
            color: #ffffff;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 7px 12px;
            border-radius: 10px;
            text-decoration: none;
            transition: background-color 0.15s ease, transform 0.15s ease;
            flex-shrink: 0;
        }
        .btn-back-portal:hover {
            background-color: rgba(255, 255, 255, 0.24);
        }
        .btn-back-portal:active {
            transform: scale(0.96);
        }

        /* Left Ribbon Tabs matching signature blue ribbon design */
        .ribbon-tab {
            background: linear-gradient(90deg, #0f4666 0%, #13547a 75%, #186896 100%);
            color: #ffffff;
            border-top: 2px solid #08283b;
            border-right: 2px solid #08283b;
            border-bottom: 2px solid #08283b;
            border-left: none;
            border-radius: 0 42px 42px 0;
            width: 152px;
            height: 62px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            font-size: 0.98rem;
            letter-spacing: 0.03em;
            cursor: pointer;
            transition: width 0.25s cubic-bezier(0.22, 1, 0.36, 1), background 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
            box-shadow: 2px 3px 8px rgba(15, 23, 42, 0.15);
            padding: 0 16px;
            user-select: none;
        }

        .ribbon-tab:hover {
            background: linear-gradient(90deg, #13547a 0%, #196b9b 100%);
            width: 168px;
        }

        /* Active Ribbon State sticks out wider */
        .ribbon-tab.active {
            width: 196px;
            background: linear-gradient(90deg, #13547a 0%, #0ea5e9 140%);
            box-shadow: 4px 6px 14px rgba(19, 84, 122, 0.38);
            font-weight: 700;
            border-color: #061824;
        }

        .ribbon-count {
            background-color: rgba(255, 255, 255, 0.18);
            color: #ffffff;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 9999px;
            min-width: 24px;
            text-align: center;
        }
        .ribbon-tab.active .ribbon-count {
            background-color: #ffffff;
            color: #13547a;
        }

        /* Mobile horizontal pills fallback for small screens */
        @media (max-width: 767px) {
            .ribbon-sidebar {
                flex-direction: row !important;
                flex-wrap: nowrap;
                overflow-x: auto;
                padding: 12px 12px 8px 12px !important;
                gap: 8px !important;
                width: 100% !important;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }
            .ribbon-sidebar::-webkit-scrollbar {
                display: none;
            }
            .ribbon-tab {
                border-left: 2px solid #08283b;
                border-radius: 9999px;
                width: auto !important;
                height: 40px;
                padding: 0 14px;
                font-size: 0.82rem;
                gap: 6px;
                flex-shrink: 0;
            }
            .ribbon-tab.active {
                width: auto !important;
                transform: translateY(-1px);
            }
        }

        /* Modern Interactive Department Card */
        .dept-card {
            background-color: #ffffff;
            border-radius: 14px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.06);
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
        }

        .dept-card:hover {
            box-shadow: 0 8px 22px rgba(15, 23, 42, 0.1);
        }

        .dept-card-header {
            padding: 11px 16px;
            font-weight: 800;
            font-size: 0.88rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .sub-section-banner {
            background-color: #b91c1c;
            color: #ffffff;
            font-weight: 700;
            text-align: left;
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            padding: 6px 16px;
            text-transform: uppercase;
        }

        .contact-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 16px;
            border-bottom: 1px solid #e2e8f0;
            transition: background-color 0.15s ease;
        }
        .contact-row:last-child {
            border-bottom: none;
        }
        .contact-row:hover {
            background-color: #f1f7fd;
        }

        .dial-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #13547a;
            font-weight: 700;
            font-size: 0.86rem;
            text-decoration: none;
            padding: 5px 11px;
            border-radius: 9999px;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .dial-pill:hover {
            background-color: #13547a;
            border-color: #13547a;
            color: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(19, 84, 122, 0.25);
        }
        .dial-pill:hover svg {
            color: #ffffff;
        }

        .dial-pill:active {
            transform: scale(0.97);
        }

        .mobile-pill {
            background-color: #ecfdf5;
            border-color: #a7f3d0;
            color: #065f46;
        }
        .mobile-pill:hover {
            background-color: #059669;
            border-color: #059669;
            color: #ffffff;
            box-shadow: 0 3px 8px rgba(5, 150, 105, 0.25);
        }

        /* Subtle fade-in animation when switching departments */
        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .table-animate {
            animation: fadeSlideIn 0.22s ease-out forwards;
        }

        /* Modal entrance animation */
        @keyframes modalPop {
            from {
                opacity: 0;
                transform: scale(0.94) translateY(8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-card {
            animation: modalPop 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>

        // Main PABX trunk prefix for extension dialing
        const PABX_PREFIX = '+6072535888';

        // State

        let searchQuery = '';
        let layoutMode = 'grid';

        // DOM References
        const directoryContainer = document.getElementById('directory-container');
        const emptyState = document.getElementById('empty-state');
        const ribbonButtons = document.querySelectorAll('.ribbon-tab');
        const activeFilterBadge = document.getElementById('active-filter-badge');

        const viewGridBtn = document.getElementById('view-grid-btn');
        const viewListBtn = document.getElementById('view-list-btn');
        const copyToast = document.getElementById('copy-toast');
        const copyToastText = document.getElementById('copy-toast-text');
        let toastTimer = null;

        // Modal DOM References
        const mobileActionModal = document.getElementById('mobile-action-modal');
        const modalContactName = document.getElementById('modal-contact-name');
        const modalContactNumber = document.getElementById('modal-contact-number');
        const modalCallBtn = document.getElementById('modal-call-btn');
        const modalWhatsappBtn = document.getElementById('modal-whatsapp-btn');
        const modalCloseX = document.getElementById('modal-close-x');
        const modalCancelBtn = document.getElementById('modal-cancel-btn');

        /**
         * Copy text helper using execCommand fallback for iframe/webview compatibility
         */
        function copyNumberToClipboard(text, label) {
            const tempInput = document.createElement('input');
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand('copy');
                copyToastText.textContent = `Copied ${label}: ${text}`;
                copyToast.classList.remove('hidden');
                copyToast.classList.add('flex');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    copyToast.classList.add('hidden');
                    copyToast.classList.remove('flex');
                }, 2200);
            } catch (err) {
                // Silent fallback if blocked
            }
            document.body.removeChild(tempInput);
        }

        /**
         * Calculate and display contact counts inside the left ribbon badges
         */
        function updateRibbonCounts() {
            const counts = { ALL: 0, HOTLINE: 0, OPS: 0, FEM: 0, CSD: 0, QHSSE: 0 };

            DIRECTORY_DATA.forEach(section => {
                let secCount = 0;
                if (section.rows) secCount += section.rows.length;
                if (section.topRows) secCount += section.topRows.length;
                if (section.subSections) {
                    section.subSections.forEach(sub => {
                        secCount += sub.rows.length;
                    });
                }
                counts[section.category] = (counts[section.category] || 0) + secCount;
                counts.ALL += secCount;
            });

            document.querySelectorAll('.ribbon-count').forEach(badge => {
                const key = badge.dataset.count;
                badge.textContent = counts[key] ?? 0;
            });
        }

        /**
         * Open Call / WhatsApp choice popup for a mobile number
         */
        function openMobileActionModal(name, rawNumber) {
            const cleanTel = rawNumber.replace(/[^\d+]/g, '');
            const waDigits = rawNumber.replace(/\D/g, '');

            modalContactName.textContent = name;
            modalContactNumber.textContent = rawNumber;
            modalCallBtn.href = `tel:${cleanTel}`;
            modalWhatsappBtn.href = `https://wa.me/${waDigits}`;

            mobileActionModal.classList.remove('hidden');
        }

        /**
         * Close Call / WhatsApp popup
         */
        function closeMobileActionModal() {
            mobileActionModal.classList.add('hidden');
        }

        // Modal dismissal handlers
        modalCloseX.addEventListener('click', closeMobileActionModal);
        modalCancelBtn.addEventListener('click', closeMobileActionModal);
        mobileActionModal.addEventListener('click', (e) => {
            if (e.target === mobileActionModal) {
                closeMobileActionModal();
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !mobileActionModal.classList.contains('hidden')) {
                closeMobileActionModal();
            }
        });

        /**
         * Render action pill for mobile popup trigger or direct extension dial link (+6072535888,XXXX)
         */
        function renderActionControl(row, isMobile) {
            const num = (row.number || '').trim();
            if (!num || num === '-') {
                return `<span class="text-xs font-semibold text-slate-400 px-3 py-1 bg-slate-100 rounded-full">No Ext</span>`;
            }

            const escapedName = (row.name || 'Contact').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            const escapedNum = num.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

            if (isMobile) {
                return `
                    <div class="flex items-center gap-1.5 shrink-0">
                        <button
                            type="button"
                            onclick="openMobileActionModal('${escapedName}', '${escapedNum}')"
                            class="dial-pill mobile-pill cursor-pointer"
                            title="Call or WhatsApp ${row.name}"
                        >
                            <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                            </svg>
                            <span>${num}</span>
                        </button>
                        <button
                            type="button"
                            onclick="copyNumberToClipboard('${escapedNum}', '${escapedName}')"
                            class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200/70 transition"
                            title="Copy mobile number"
                            aria-label="Copy mobile number"
                        >
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                            </svg>
                        </button>
                    </div>
                `;
            }

            // 4-digit extension: displays only 4 digits, dials tel:+6072535888,XXXX immediately on click
            const dialHref = `tel:${PABX_PREFIX},${num}`;
            return `
                <div class="flex items-center gap-1.5 shrink-0">
                    <a
                        href="${dialHref}"
                        class="dial-pill"
                        title="Dial ${PABX_PREFIX},${num}"
                    >
                        <svg class="w-3.5 h-3.5 text-[#13547a] shrink-0 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                        </svg>
                        <span>${num}</span>
                    </a>
                    <button
                        type="button"
                        onclick="copyNumberToClipboard('${PABX_PREFIX},${escapedNum}', 'Ext ${escapedNum}')"
                        class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200/70 transition"
                        title="Copy full dial string (${PABX_PREFIX},${num})"
                        aria-label="Copy extension"
                    >
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                        </svg>
                    </button>
                </div>
            `;
        }

        /**
         * Render a single contact row inside a department card
         */
        function renderContactRow(row, isMobile) {
            const displayName = row.name
                ? `<span class="text-sm font-medium text-slate-800 leading-snug">${row.name}</span>`
                : `<span class="text-xs italic text-slate-400">General Line / Unassigned</span>`;

            return `
                <div class="contact-row">
                    <div class="min-w-0 pr-2">${displayName}</div>
                    ${renderActionControl(row, isMobile)}
                </div>
            `;
        }

        /**
         * Render all matching directory cards
         */
        function renderDirectory() {
            const q = searchQuery.trim().toLowerCase();
            directoryContainer.innerHTML = '';
            let renderedCards = 0;
            let totalVisibleContacts = 0;

            DIRECTORY_DATA.forEach(section => {
                // Department category filter
                if (activeCategory !== 'ALL' && section.category !== activeCategory) {
                    return;
                }

                // Handle sections with sub-banners (QHSSE)
                if (section.subSections) {
                    const matchedTopRows = (section.topRows || []).filter(r =>
                        !q ||
                        r.name.toLowerCase().includes(q) ||
                        r.number.toLowerCase().includes(q) ||
                        section.title.toLowerCase().includes(q)
                    );

                    const filteredSubSections = section.subSections.map(sub => {
                        const matchedRows = sub.rows.filter(r =>
                            !q ||
                            r.name.toLowerCase().includes(q) ||
                            r.number.toLowerCase().includes(q) ||
                            sub.banner.toLowerCase().includes(q) ||
                            section.title.toLowerCase().includes(q)
                        );
                        return { ...sub, rows: matchedRows };
                    }).filter(sub => !q || sub.rows.length > 0);

                    const totalSubRows = matchedTopRows.length + filteredSubSections.reduce((acc, s) => acc + s.rows.length, 0);
                    if (q && totalSubRows === 0) return;

                    totalVisibleContacts += totalSubRows;

                    const card = document.createElement('section');
                    card.className = 'dept-card table-animate';

                    let html = `
                        <div class="dept-card-header" style="background-color: ${section.headerBg}; color: ${section.headerText};">
                            <span>${section.title}</span>
                            <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-black/15">${totalSubRows}</span>
                        </div>
                        <div class="bg-slate-100 px-4 py-1.5 border-b border-slate-200 flex justify-between text-[11px] font-bold uppercase tracking-wider text-slate-600">
                            <span>Name / Unit</span>
                            <span>${section.secondColLabel}</span>
                        </div>
                        <div>
                    `;

                    matchedTopRows.forEach(row => {
                        html += renderContactRow(row, false);
                    });

                    filteredSubSections.forEach(sub => {
                        html += `<div class="sub-section-banner">${sub.banner}</div>`;
                        if (sub.rows.length === 0) {
                            html += `<div class="contact-row text-xs text-slate-400 italic">No direct extension listed</div>`;
                        } else {
                            sub.rows.forEach(row => {
                                html += renderContactRow(row, false);
                            });
                        }
                    });

                    html += `</div>`;
                    card.innerHTML = html;
                    directoryContainer.appendChild(card);
                    renderedCards++;
                    return;
                }

                // Standard flat department card
                const filteredRows = section.rows.filter(r =>
                    !q ||
                    r.name.toLowerCase().includes(q) ||
                    r.number.toLowerCase().includes(q) ||
                    section.title.toLowerCase().includes(q)
                );

                if (q && filteredRows.length === 0) return;

                totalVisibleContacts += filteredRows.length;

                const card = document.createElement('section');
                card.className = 'dept-card table-animate';

                let html = `
                    <div class="dept-card-header" style="background-color: ${section.headerBg}; color: ${section.headerText};">
                        <span>${section.title}</span>
                        <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-black/15">${filteredRows.length}</span>
                    </div>
                    <div class="bg-slate-100 px-4 py-1.5 border-b border-slate-200 flex justify-between text-[11px] font-bold uppercase tracking-wider text-slate-600">
                        <span>Name / Unit</span>
                        <span>${section.secondColLabel}</span>
                    </div>
                    <div>
                `;

                filteredRows.forEach(row => {
                    html += renderContactRow(row, Boolean(section.isMobile));
                });

                html += `</div>`;
                card.innerHTML = html;
                directoryContainer.appendChild(card);
                renderedCards++;
            });

            visibleCountLabel.textContent = `(${totalVisibleContacts} contact${totalVisibleContacts === 1 ? '' : 's'})`;

            // Toggle empty state
            if (renderedCards === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }
        }

        /**
         * Switch between 2-column Grid view and 1-column List view
         */
        function setLayoutMode(mode) {
            layoutMode = mode;
            if (mode === 'grid') {
                directoryContainer.className = 'grid grid-cols-1 lg:grid-cols-2 gap-5 items-start';
                viewGridBtn.className = 'px-2.5 py-1.5 text-xs font-semibold rounded-md bg-[#13547a] text-white transition flex items-center gap-1';
                viewListBtn.className = 'px-2.5 py-1.5 text-xs font-semibold rounded-md text-slate-600 hover:text-slate-900 transition flex items-center gap-1';
            } else {
                directoryContainer.className = 'flex flex-col gap-5 max-w-2xl';
                viewListBtn.className = 'px-2.5 py-1.5 text-xs font-semibold rounded-md bg-[#13547a] text-white transition flex items-center gap-1';
                viewGridBtn.className = 'px-2.5 py-1.5 text-xs font-semibold rounded-md text-slate-600 hover:text-slate-900 transition flex items-center gap-1';
            }
        }

        viewGridBtn.addEventListener('click', () => setLayoutMode('grid'));
        viewListBtn.addEventListener('click', () => setLayoutMode('list'));

        /**
         * Update active ribbon state & filter label
         */
        function setCategoryFilter(category) {
            activeCategory = category;

            ribbonButtons.forEach(btn => {
                if (btn.dataset.dept === category) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            const labels = {
                ALL: 'ALL DEPARTMENTS',
                HOTLINE: 'HOTLINE CONTACTS',
                OPS: 'OPS (EXECUTION & PLANNING)',
                FEM: 'FEM (FACILITIES, EQUIPMENT & MAINTENANCE)',
                CSD: 'CSD (CORPORATE SERVICES & SUPPORT)',
                QHSSE: 'QHSSE (QUALITY, SAFETY, SECURITY & ENVIRONMENT)'
            };

            activeFilterBadge.textContent = labels[category] || category;
            renderDirectory();
        }

        // Ribbon click events (clicking active ribbon again toggles back to ALL)
        ribbonButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const selected = btn.dataset.dept;
                if (selected === activeCategory && selected !== 'ALL') {
                    setCategoryFilter('ALL');
                } else {
                    setCategoryFilter(selected);
                }
            });
        });

        // Search input events
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            clearSearchBtn.classList.toggle('hidden', !searchQuery);
            renderDirectory();
        });

        clearSearchBtn.addEventListener('click', () => {
            searchQuery = '';
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            renderDirectory();
        });

        // Reset triggers
        function resetAllFilters() {
            searchQuery = '';
            searchInput.value = '';
            clearSearchBtn.classList.add('hidden');
            setCategoryFilter('ALL');
        }

        document.getElementById('btn-reset-top').addEventListener('click', resetAllFilters);
        document.getElementById('btn-empty-reset').addEventListener('click', resetAllFilters);
        document.getElementById('header-reset').addEventListener('click', resetAllFilters);

        // Initial render on window load
        window.addEventListener('DOMContentLoaded', () => {
            updateRibbonCounts();
            renderDirectory();
        });
    </script>
