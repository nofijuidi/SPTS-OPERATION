<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SPTS - Equipment Inspection</title>
  <meta name="theme-color" content="#0f172a">

  <!-- Mobile Full-Screen Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      -khtml-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
    }

    input, textarea {
      -webkit-user-select: text !important;
      user-select: text !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #334155;

      /* Account for iPhone safe areas notch/status bar */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .app-viewport {
      width: 100vw;
      height: 100vh;
      max-width: 412px;
      max-height: 892px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    @media (min-width: 480px) {
      .app-viewport {
        border-radius: 28px;
        height: 844px;
      }
    }

    .view-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-y: auto;
    }

    .hidden { display: none !important; }

    .top-right-app-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid #cbd5e1;
    }

    .inspection-top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .btn-home-icon {
      width: 40px;
      height: 40px;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      color: #002060;
    }

    .inspection-header-title {
      flex: 1;
      text-align: center;
      color: #002060;
      font-size: 18px;
      font-weight: 800;
      padding: 0 8px;
    }

    .banner-bar {
      display: flex;
      width: 100%;
      height: 38px;
      border-radius: 8px;
      overflow: hidden;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 12px;
      border: 1.5px solid #0078D4;
    }

    .shift-day { background-color: #ffd700 !important; color: #000000 !important; }
    .shift-night { background-color: #002060 !important; color: #ffffff !important; }

    .banner-shift {
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      font-weight: 900;
    }

    .banner-date {
      background-color: #ffffff;
      color: #000000;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-evenly;
      font-size: 15px;
      font-weight: 800;
    }

    .user-info-banner {
      color: #002060;
      font-weight: 800;
      font-size: 15px;
      margin-bottom: 14px;
      line-height: 1.3;
    }

    .user-info-company {
      font-size: 15px;
      font-weight: 800;
      color: #002060;
    }

    .user-info-details {
      font-size: 15px;
      font-weight: 800;
      color: #002060;
    }

    .form-row-2col {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .form-group { margin-bottom: 12px; }
    .form-group-flex { flex: 1; margin-bottom: 0; }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 800;
      color: #002060;
      margin-bottom: 4px;
    }

    .form-input {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 600;
      border: 1.5px solid #0078D4;
      border-radius: 8px;
      outline: none;
      color: #0f172a;
    }

    .active-pillbox-area { margin-bottom: 14px; }
    .grid-container-num { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 6px; max-height: 150px; overflow-y: auto; padding: 2px; }
    .grid-container-eq { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-height: 160px; overflow-y: auto; padding: 2px; }
    .grid-container-list { display: flex; flex-direction: column; gap: 5px; max-height: 150px; overflow-y: auto; padding: 2px; }
    .grid-box { background-color: #3b62b0; color: #ffffff; font-size: 11px; font-weight: 800; text-align: center; padding: 10px 2px; border-radius: 6px; cursor: pointer; border: 1px solid #2d4e93; display: flex; align-items: center; justify-content: center; text-transform: uppercase; }
    .grid-box-list { background-color: #3b62b0; color: #ffffff; font-size: 12px; font-weight: 700; text-align: left; padding: 9px 12px; border-radius: 6px; cursor: pointer; border: 1px solid #2d4e93; }
    .grid-box.selected, .grid-box-list.selected { background-color: #1d4ed8; box-shadow: inset 0 0 0 2px #ffffff; }

    .declaration-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .btn-header-group {
      display: flex;
      gap: 6px;
    }

    .btn-clear {
      background-color: #e00000;
      color: #ffffff;
      font-size: 13px;
      font-weight: 900;
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-refresh {
      background-color: #00a651;
      color: #ffffff;
      font-size: 13px;
      font-weight: 900;
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .declaration-table-box {
      width: 100%;
      max-height: 140px;
      overflow-y: auto;
      border: 1.5px solid #0078D4;
      border-radius: 8px;
      background-color: #f8fafc;
      padding: 1px;
    }

    .declaration-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .declaration-table th {
      background-color: #002060;
      color: #ffffff;
      font-weight: 800;
      text-align: left;
      padding: 6px 5px;
      position: sticky;
      top: 0;
      z-index: 2;
      border-right: 1px solid #1a365d;
    }

    .declaration-table td {
      padding: 6px 5px;
      border-bottom: 1px solid #e2e8f0;
      color: #1e293b;
      font-weight: 600;
      word-break: break-word;
    }

    .declaration-empty {
      text-align: center;
      padding: 12px;
      color: #64748b;
      font-size: 13px;
      font-style: italic;
      font-weight: 700;
    }

    .action-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 14px;
    }

    .btn-submit-inspection {
      flex: 1;
      background-color: #3b62b0;
      color: white;
      font-size: 18px;
      font-weight: 800;
      border: none;
      border-radius: 8px;
      height: 48px;
      cursor: pointer;
    }

    .btn-back-round {
      width: 48px;
      height: 48px;
      border: 2px solid #3b62b0;
      border-radius: 50%;
      background: white;
      color: #3b62b0;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .alert-error {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 12px;
      text-align: center;
      font-weight: 700;
    }

    .modal-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      padding: 24px; z-index: 100;
    }

    .modal-card {
      background-color: #ffffff;
      width: 100%;
      border-radius: 16px;
      padding: 24px 20px;
      border: 1.5px solid #0078D4;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .modal-greeting-line, .modal-declaring-line { 
      font-size: 18px; 
      font-weight: 500; 
      color: #0f172a; 
      margin-bottom: 2px; 
    }

    .modal-status-highlight { 
      font-size: 19px; 
      font-weight: 800; 
      color: #000; 
      margin-bottom: 16px; 
    }

    .modal-date-line { 
      font-size: 18px; 
      font-weight: 500; 
      color: #0f172a; 
      margin-bottom: 20px; 
    }

    .modal-action-title {
      font-size: 18px;
      font-weight: 500;
      color: #0f172a;
      margin-bottom: 12px;
    }

    .modal-checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .modal-checkbox-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 500;
      color: #0f172a;
      cursor: pointer;
    }

    .modal-checkbox-item input[type="checkbox"] {
      width: 22px;
      height: 22px;
      border: 2px solid #0f172a;
      border-radius: 4px;
      accent-color: #0078D4;
      cursor: pointer;
    }

    .modal-btn-row { display: flex; gap: 12px; }
    
    .btn-popup-cancel { 
      flex: 1; 
      height: 48px; 
      background-color: #cc0000; 
      color: white; 
      font-size: 18px;
      font-weight: 800; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
    }

    .btn-popup-confirm { 
      flex: 1; 
      height: 48px; 
      background-color: #1d68d8; 
      color: white; 
      font-size: 18px;
      font-weight: 800; 
      border: none; 
      border-radius: 10px; 
      cursor: pointer; 
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="view-screen">
      
      <!-- Top Nav -->
      <div class="inspection-top-nav">
        <div class="btn-home-icon" onclick="goHome()" title="Go to Home Page">🏠</div>
        <div class="inspection-header-title">EQUIPMENT INSPECTION</div>
        <img src="../icon-192.png" alt="App Icon" class="top-right-app-icon" onerror="this.style.display='none'" />
      </div>

      <div id="errorMessage" class="alert-error hidden"></div>

      <!-- Live Shift & Date Banner -->
      <div class="banner-bar">
        <div class="banner-shift shift-day" id="shiftBanner">DAY SHIFT</div>
        <div class="banner-date" id="liveDateTime">
          <span id="datePart">--/--/----</span>
          <span id="timePart">--:--</span>
          <span id="secPart">00ss</span>
        </div>
      </div>

      <!-- User Info Header -->
      <div class="user-info-banner">
        <div class="user-info-company" id="inspCompany">SPTS</div>
        <div class="user-info-details" id="inspOperator">T5218 | NOFIJUIDI BIN JUMRI</div>
      </div>

      <!-- Inputs -->
      <div class="form-row-2col">
        <div class="form-group-flex">
          <label class="form-label">Select Equipment</label>
          <input type="text" id="selectEquipment" class="form-input" placeholder="Select type..." autocomplete="off" onfocus="setActiveMode('equipment')" oninput="refreshActivePillbox()" />
        </div>
        <div class="form-group-flex">
          <label class="form-label">Equipment Number</label>
          <input type="text" id="selectEquipmentNo" class="form-input" placeholder="Select number..." autocomplete="off" onfocus="setActiveMode('number')" oninput="onEquipmentNoInputChange(this.value)" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Select Issue</label>
        <input type="text" id="selectIssue" class="form-input" placeholder="Type or select issue..." autocomplete="off" onfocus="setActiveMode('issue')" oninput="refreshActivePillbox()" />
      </div>

      <!-- Grid Area -->
      <div id="activePillboxArea" class="active-pillbox-area">
        <div id="pillboxGrid" class="grid-container-eq"></div>
      </div>

      <!-- Declaration Table Section -->
      <div class="form-group">
        <div class="declaration-header-row">
          <label class="form-label" style="margin-bottom: 0;" id="declarationLabel">Declaration (last 12 hours)</label>
          <div class="btn-header-group">
            <button class="btn-clear" onclick="clearAllInputs()">CLEAR</button>
            <button class="btn-refresh" onclick="loadUser12HourLogs()">REFRESH</button>
          </div>
        </div>

        <div class="declaration-table-box">
          <table class="declaration-table">
            <thead>
              <tr>
                <th style="width: 30%;">DATE</th>
                <th style="width: 25%;">EQUIPNUM</th>
                <th style="width: 30%;">AREA</th>
                <th style="width: 15%;">ID</th>
              </tr>
            </thead>
            <tbody id="declarationLogsBody">
              <tr><td colspan="4" class="declaration-empty">No declarations found.</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Action Footer -->
      <div class="action-row">
        <button id="sendBtn" class="btn-submit-inspection" onclick="showConfirmModal()">Submit</button>
        <div class="btn-back-round" onclick="goHome()">➔</div>
      </div>

    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-greeting-line" id="modalGreeting">Dear Operator,</div>
        <div class="modal-declaring-line">You are declaring <strong id="modalEquipNum">-</strong></div>
        <div class="modal-status-highlight" id="modalIssue">-</div>

        <div class="modal-date-line" id="modalFormattedDate">On --/--/----</div>

        <div class="modal-action-title">Your action will be</div>

        <div class="modal-checkbox-group">
          <label class="modal-checkbox-item">
            <input type="checkbox" class="action-chk" value="Sent to Workshop">
            <span>Sent to Workshop</span>
          </label>
          <label class="modal-checkbox-item">
            <input type="checkbox" class="action-chk" value="Continue with Issue">
            <span>Continue with Issue</span>
          </label>
          <label class="modal-checkbox-item">
            <input type="checkbox" class="action-chk" value="Change Equipment">
            <span>Change Equipment</span>
          </label>
        </div>

        <div class="modal-btn-row">
          <button class="btn-popup-cancel" onclick="hideConfirmModal()">CANCEL</button>
          <button id="confirmSubmitBtn" class="btn-popup-confirm" onclick="executeSubmission()">CONFIRM</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let EQUIPMENT_DATABASE = {};
    let ISSUE_DATABASE = {};
    let REVERSE_LOOKUP = {};
    let currentUser = null;
    let activePillboxMode = 'equipment';

    const CHECKLIST_FLOW_URL = "https://default227dccee4218411f91e74dabddf0f5.f8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/08/workflows/d7ac73d3d7d7423eb077a2895b0738df/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=OLDn8ig2sbXDzxKke7ijuD4cLHTaQS-3v2oVkSIDrMw";
    const GET_LOGS_FLOW_URL = "https://default227dccee4218411f91e74dabddf0f5.f8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/23/workflows/41d16fdee72843db94d61e4ec314841a/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=_qpB6B3yesT9KNhGtnsB6oRu4TFovZPbjrKnykFpXck";

    function getPropValue(obj, keys, defaultValue = 'N/A') {
      if (!obj) return defaultValue;
      for (const k of keys) {
        if (obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== '') return obj[k];
      }
      return defaultValue;
    }

    function checkSession() {
      const activeSession = sessionStorage.getItem('userSession');
      if (activeSession) {
        currentUser = JSON.parse(activeSession);
      } else {
        currentUser = {
          COMPANY: "SPTS",
          COMPANY_ID: "T5218",
          NAME: "NOFIJUIDI BIN JUMRI",
          GROUP: "N/A"
        };
      }

      const comp = getPropValue(currentUser, ['COMPANY', 'Company', 'company'], 'SPTS');
      const staffId = getPropValue(currentUser, ['COMPANY_ID', 'company_id', 'Company_ID', 'ID', 'id'], 'T5218');
      const staffName = getPropValue(currentUser, ['NAME', 'Title', 'title', 'name'], 'NOFIJUIDI BIN JUMRI');

      document.getElementById('inspCompany').innerText = comp;
      document.getElementById('inspOperator').innerText = `${staffId} | ${staffName}`;
    }

    function startLiveTicker() {
      setInterval(() => {
        const now = new Date();
        const dd = String(now.getDate()).padStart(2, '0');
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const yyyy = now.getFullYear();
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');

        document.getElementById('datePart').innerText = `${dd}/${mm}/${yyyy}`;
        document.getElementById('timePart').innerText = `${hh}:${min}`;
        document.getElementById('secPart').innerText = `${ss}ss`;

        const totalMinutes = (now.getHours() * 60) + now.getMinutes();
        const shiftBanner = document.getElementById('shiftBanner');
        if (totalMinutes >= (8 * 60) && totalMinutes <= (20 * 60)) {
          shiftBanner.innerText = "DAY SHIFT";
          shiftBanner.className = "banner-shift shift-day";
        } else {
          shiftBanner.innerText = "NIGHT SHIFT";
          shiftBanner.className = "banner-shift shift-night";
        }
      }, 1000);
    }

    function clearAllInputs() {
      document.getElementById('selectEquipment').value = '';
      document.getElementById('selectEquipmentNo').value = '';
      document.getElementById('selectIssue').value = '';
      document.getElementById('errorMessage').classList.add('hidden');
      setActiveMode('equipment');
    }

    function selectPill(val) {
      if (activePillboxMode === 'equipment') {
        document.getElementById('selectEquipment').value = val;
        document.getElementById('selectEquipmentNo').value = '';
        setActiveMode('number');
      } else if (activePillboxMode === 'number') {
        document.getElementById('selectEquipmentNo').value = val;
        if (REVERSE_LOOKUP[val.toUpperCase()]) {
          document.getElementById('selectEquipment').value = REVERSE_LOOKUP[val.toUpperCase()];
        }
        setActiveMode('issue');
      } else if (activePillboxMode === 'issue') {
        document.getElementById('selectIssue').value = val;
        refreshActivePillbox();
      }
    }

    function goHome() {
      window.location.href = '../index.html';
    }

    async function loadConfigData() {
      try {
        const res = await fetch('../data.json');
        if (res.ok) {
          const freshData = await res.json();
          EQUIPMENT_DATABASE = freshData.EQUIPMENT_DATABASE || {};
          ISSUE_DATABASE = freshData.ISSUE_DATABASE || {};
          REVERSE_LOOKUP = {};
          for (const [eqType, numList] of Object.entries(EQUIPMENT_DATABASE)) {
            numList.forEach(num => { REVERSE_LOOKUP[num.toUpperCase()] = eqType; });
          }
        }
      } catch (e) {
        console.warn("Using default view config.");
      }
      refreshActivePillbox();
    }

    function setActiveMode(mode) {
      activePillboxMode = mode;
      refreshActivePillbox();
    }

    function refreshActivePillbox() {
      const eqVal = document.getElementById('selectEquipment').value.trim();
      const numVal = document.getElementById('selectEquipmentNo').value.trim();
      const issueVal = document.getElementById('selectIssue').value.trim();

      const grid = document.getElementById('pillboxGrid');
      
      if (activePillboxMode === 'equipment') {
        grid.className = 'grid-container-eq';
        let defaultEqs = Object.keys(EQUIPMENT_DATABASE);
        if (defaultEqs.length === 0) {
          defaultEqs = ["PM", "TRAILER", "FORKLIFT", "TIPPER", "RTG", "ECH", "CRS", "SHOVEL", "SHIPLOADER", "RECLAIMER", "STACKER", "CONVEYOR"];
        }
        
        const eqQuery = eqVal.toUpperCase();
        const filteredEqs = eqQuery === '' ? defaultEqs : defaultEqs.filter(e => e.includes(eqQuery));

        grid.innerHTML = filteredEqs.map(eq => `<div class="grid-box ${eq === eqVal.toUpperCase() ? 'selected' : ''}" onclick="selectPill('${eq}')">${eq}</div>`).join('');

      } else if (activePillboxMode === 'number') {
        grid.className = 'grid-container-num';
        
        let numSource = [];
        if (eqVal !== '' && EQUIPMENT_DATABASE[eqVal.toUpperCase()]) {
          numSource = EQUIPMENT_DATABASE[eqVal.toUpperCase()];
        } else {
          numSource = Object.values(EQUIPMENT_DATABASE).flat();
          if (numSource.length === 0) {
            numSource = ["EQ-01", "EQ-02", "EQ-03", "EQ-04", "EQ-05", "EQ-06", "EQ-07", "EQ-08"];
          }
        }

        const numQuery = numVal.toUpperCase();
        const numFiltered = numQuery === '' ? numSource : numSource.filter(n => String(n).toUpperCase().includes(numQuery));

        if (numFiltered.length === 0) {
          grid.innerHTML = `<div style="grid-column: 1/-1; color: #64748b; font-size: 12px; font-style: italic; text-align: center; padding: 10px;">No matching numbers</div>`;
        } else {
          grid.innerHTML = numFiltered.map(n => `<div class="grid-box ${String(n).toUpperCase() === numVal.toUpperCase() ? 'selected' : ''}" onclick="selectPill('${n}')">${n}</div>`).join('');
        }

      } else if (activePillboxMode === 'issue') {
        grid.className = 'grid-container-list';
        let issueSource = (eqVal && ISSUE_DATABASE[eqVal.toUpperCase()]) ? ISSUE_DATABASE[eqVal.toUpperCase()] : ["Aircond - Swing Tidak Berfungsi", "Engine - Leaking Oil", "Brake - Low Pressure", "I've checked and declared all OK"];
        
        const rawIssueQuery = issueVal.trim().toUpperCase();
        const keywords = rawIssueQuery.split(' ').filter(k => k.length > 0);

        let issueFiltered = keywords.length === 0 
          ? issueSource 
          : issueSource.filter(i => keywords.every(kw => i.toUpperCase().includes(kw)));

        if (issueFiltered.length === 0) {
          grid.innerHTML = `<div style="color: #64748b; font-size: 12px; font-style: italic; text-align: center; padding: 10px;">No matching issues found</div>`;
        } else {
          grid.innerHTML = issueFiltered.map(i => `<div class="grid-box-list ${i === issueVal ? 'selected' : ''}" onclick="selectPill('${i}')">${i}</div>`).join('');
        }
      }
    }

    function onEquipmentNoInputChange(val) {
      const num = val.trim().toUpperCase();
      if (REVERSE_LOOKUP[num]) {
        document.getElementById('selectEquipment').value = REVERSE_LOOKUP[num];
      }
      setActiveMode('number');
    }

    // Helper: Parse Excel date strings safely into JS Date object
    function parseExcelDate(dateStr) {
      if (!dateStr || dateStr === '-') return null;
      
      let d = new Date(dateStr);
      if (!isNaN(d.getTime())) return d;

      try {
        const parts = String(dateStr).trim().split(' ');
        const dateParts = parts[0].split(/[\/-]/);
        const timeParts = parts[1] ? parts[1].split(':') : [0, 0, 0];

        if (dateParts.length === 3) {
          let month = parseInt(dateParts[0], 10) - 1;
          let day = parseInt(dateParts[1], 10);
          let year = parseInt(dateParts[2], 10);

          if (year < 100) year += 2000;

          let hours = parseInt(timeParts[0] || 0, 10);
          let mins = parseInt(timeParts[1] || 0, 10);
          let secs = parseInt(timeParts[2] || 0, 10);

          d = new Date(year, month, day, hours, mins, secs);
          if (!isNaN(d.getTime())) return d;
        }
      } catch (e) {}

      return null;
    }

    async function loadUser12HourLogs() {
      const tbody = document.getElementById('declarationLogsBody');
      tbody.innerHTML = `<tr><td colspan="4" class="declaration-empty">Loading logs...</td></tr>`;
      
      const userIdVal = String(getPropValue(currentUser, ['COMPANY_ID', 'company_id', 'Company_ID', 'ID', 'id'], 'T5218')).trim().toLowerCase();

      try {
        const response = await fetch(GET_LOGS_FLOW_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ FETCH_ALL: true })
        });

        if (response.ok) {
          let rawLogs = await response.json();
          
          if (!Array.isArray(rawLogs) && rawLogs.value && Array.isArray(rawLogs.value)) {
            rawLogs = rawLogs.value;
          }

          if (!Array.isArray(rawLogs) || rawLogs.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="declaration-empty">No declarations found.</td></tr>`;
            return;
          }

          const twelveHoursAgo = new Date(Date.now() - (12 * 60 * 60 * 1000));

          const user12HourLogs = rawLogs.filter(row => {
            const rowUser = String(getPropValue(row, ['COMPANY_ID', 'company_id', 'COMPANY ID', 'ID', 'id'], '')).trim().toLowerCase();
            const rawDate = getPropValue(row, ['DATE', 'date', 'Date'], '');
            const parsedDate = parseExcelDate(rawDate);

            const isUserMatch = rowUser === userIdVal;
            const isRecentMatch = parsedDate ? (parsedDate >= twelveHoursAgo) : true;

            return isUserMatch && isRecentMatch;
          });

          renderLogsTable(user12HourLogs);
        } else {
          tbody.innerHTML = `<tr><td colspan="4" class="declaration-empty">No declarations found.</td></tr>`;
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="4" class="declaration-empty">No declarations found.</td></tr>`;
      }
    }

    function formatLogDate(rawDateStr) {
      if (!rawDateStr || rawDateStr === '-') return '-';
      const str = String(rawDateStr).trim();
      const d = parseExcelDate(str);
      if (d) {
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const yyyy = d.getFullYear();
        const hh = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        return `${dd}/${mm}/${yyyy} ${hh}:${min}`;
      }
      return rawDateStr;
    }

    function renderLogsTable(logs) {
      const tbody = document.getElementById('declarationLogsBody');
      tbody.innerHTML = '';

      if (!logs || !Array.isArray(logs) || logs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="declaration-empty">No declarations found.</td></tr>`;
        return;
      }

      logs.forEach(row => {
        const tr = document.createElement('tr');
        const formattedDate = formatLogDate(getPropValue(row, ['DATE', 'date', 'Date'], '-'));
        
        tr.innerHTML = `
          <td>${formattedDate}</td>
          <td><strong>${getPropValue(row, ['EQUIPNUM', 'equipnum', 'EquipNum'], '-')}</strong></td>
          <td>${getPropValue(row, ['AREA', 'area', 'Area'], '-')}</td>
          <td><strong>${getPropValue(row, ['COMPANY_ID', 'company_id', 'COMPANY ID', 'ID', 'id'], '-')}</strong></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function showConfirmModal() {
      const equipment = document.getElementById('selectEquipment').value.trim();
      const equipmentNo = document.getElementById('selectEquipmentNo').value.trim();
      const issue = document.getElementById('selectIssue').value.trim();

      if (!equipment) return showError("Please select the Equipment.");
      if (!equipmentNo) return showError("Please put the Equipment Number");
      if (!issue) return showError("Please update the Equipment Condition");

      const rawName = getPropValue(currentUser, ['NAME', 'Title', 'title', 'name'], 'NOFIJUIDI BIN JUMRI');
      const firstName = rawName.split(' ')[0];

      document.getElementById('modalGreeting').innerText = `Dear ${firstName}`;
      document.getElementById('modalEquipNum').innerText = equipmentNo;
      document.getElementById('modalIssue').innerText = issue;
      document.getElementById('modalFormattedDate').innerText = `On ${new Date().toLocaleDateString()}`;

      document.querySelectorAll('.action-chk').forEach(chk => chk.checked = false);

      document.getElementById('confirmModal').classList.remove('hidden');
    }

    function hideConfirmModal() {
      document.getElementById('confirmModal').classList.add('hidden');
    }

    async function executeSubmission() {
      const equipment = document.getElementById('selectEquipment').value.trim();
      const equipmentNo = document.getElementById('selectEquipmentNo').value.trim();
      const issue = document.getElementById('selectIssue').value.trim();
      const shiftText = document.getElementById('shiftBanner').innerText;
      const confirmBtn = document.getElementById('confirmSubmitBtn');

      const selectedActions = Array.from(document.querySelectorAll('.action-chk:checked'))
                                  .map(c => c.value)
                                  .join(', ');

      const userIdVal = getPropValue(currentUser, ['COMPANY_ID', 'company_id', 'Company_ID', 'ID', 'id'], 'T5218');
      
      const payload = {
        date: new Date().toISOString().replace('T', ' ').substring(0, 19),
        shift: shiftText,
        COMPANY_ID: String(userIdVal),
        Title: String(getPropValue(currentUser, ['NAME', 'Title', 'title', 'name'], 'Unknown')),
        company: String(getPropValue(currentUser, ['COMPANY', 'Company', 'company'], 'SPTS')),
        group: String(getPropValue(currentUser, ['GROUP', 'Group', 'group'], 'N/A')),
        equipment: String(equipment),
        equipnum: String(equipmentNo),
        area: String(issue),
        declaration: String(selectedActions),
        action: String(selectedActions),
        isNewIssue: true
      };

      confirmBtn.disabled = true;
      confirmBtn.innerText = 'Submitting...';

      try {
        const response = await fetch(CHECKLIST_FLOW_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          document.getElementById('selectIssue').value = '';
          hideConfirmModal();
          loadUser12HourLogs();
        } else {
          hideConfirmModal();
          showError('Failed to submit inspection log.');
        }
      } catch (err) {
        hideConfirmModal();
        showError('Network error.');
      } finally {
        confirmBtn.disabled = false;
        confirmBtn.innerText = 'CONFIRM';
      }
    }

    function showError(msg) {
      const errorBox = document.getElementById('errorMessage');
      errorBox.innerText = msg;
      errorBox.classList.remove('hidden');
    }

    document.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('DOMContentLoaded', () => {
      checkSession();
      loadConfigData();
      startLiveTicker();
      loadUser12HourLogs();
    });
  </script>
