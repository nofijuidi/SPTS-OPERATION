<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>SPTS - Manpower Booking</title>
  <meta name="theme-color" content="#0f172a">

  <!-- Mobile Full-Screen Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Preconnect to CDNs & Google Script -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://script.google.com" crossorigin>

  <!-- High Definition PDF Engine & Touch Panzoom -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Allow typing and selection inside search input */
    input {
      -webkit-user-select: text !important;
      user-select: text !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #334155;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .app-viewport {
      width: 100vw;
      height: 100vh;
      max-width: 412px;
      max-height: 892px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    @media (min-width: 480px) and (orientation: portrait) {
      .app-viewport {
        border-radius: 28px;
        height: 844px;
      }
    }

    .view-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 14px;
      overflow: hidden;
    }

    .booking-top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .btn-home-icon {
      width: 38px;
      height: 38px;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      color: #002060;
    }

    .booking-header-title {
      flex: 1;
      text-align: center;
      color: #002060;
      font-size: 17px;
      font-weight: 800;
    }

    .filter-info-bar {
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      color: #1e40af;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .file-list-container {
      margin-bottom: 8px;
    }

    .file-card {
      background-color: #f8fafc;
      border: 1.5px solid #0078D4;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 700;
      color: #0078D4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* OPTION C: NAME / ID SEARCH BAR */
    .search-bar-container {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      padding: 5px 8px;
      margin-bottom: 10px;
      transition: border-color 0.15s;
    }

    .search-bar-container:focus-within {
      border-color: #0078D4;
      background-color: #ffffff;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      font-size: 13px;
      font-weight: 600;
      color: #0f172a;
      outline: none;
    }

    .search-input::placeholder {
      color: #94a3b8;
      font-weight: 500;
    }

    .search-count {
      font-size: 11px;
      font-weight: 800;
      color: #475569;
      background: #e2e8f0;
      padding: 2px 6px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .search-nav-btn {
      width: 28px;
      height: 28px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      color: #0f172a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-nav-btn:active {
      background: #e2e8f0;
    }

    /* PDF VIEWPORT */
    .pdf-card-container {
      flex: 1;
      width: 100%;
      border: 1.5px solid #0078D4;
      border-radius: 12px;
      overflow: hidden;
      background-color: #525659;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      touch-action: none;
    }

    /* OPTION A: FLOATING PAGE COUNTER BADGE */
    .page-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 50;
      background: rgba(15, 23, 42, 0.82);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.4px;
      backdrop-filter: blur(4px);
      pointer-events: none;
    }

    .zoom-toolbar {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: rgba(15, 23, 42, 0.85);
      padding: 6px 8px;
      border-radius: 10px;
      backdrop-filter: blur(4px);
    }

    .zoom-btn {
      height: 38px;
      background: #ffffff;
      border: 1px solid #0f172a;
      border-radius: 8px;
      font-weight: 800;
      font-size: 16px;
      color: #0f172a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      flex: 1;
    }

    .zoom-btn-icon {
      min-width: 40px;
      max-width: 46px;
    }

    .zoom-btn-100 {
      font-size: 12px;
      font-weight: 900;
      background-color: #e0f2fe;
      border-color: #0284c7;
      color: #0369a1;
      flex: 1.2;
    }

    .zoom-btn-text {
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.5px;
      background-color: #fef3c7;
      border-color: #d97706;
      color: #0f172a;
      flex: 1.2;
    }

    .zoom-btn:active {
      background: #e2e8f0;
      transform: scale(0.95);
    }

    .panzoom-wrapper {
      cursor: grab;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      transform-origin: center center;
      touch-action: none;
      will-change: transform;
    }

    .panzoom-wrapper:active {
      cursor: grabbing;
    }

    /* Page wrapper holds both the PDF canvas and search highlight overlays */
    .pdf-page-wrapper {
      position: relative;
      margin: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      border-radius: 4px;
      background-color: #ffffff;
      touch-action: none;
    }

    canvas.pdf-page-canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 4px;
      touch-action: none;
    }

    /* Highlight layer for Name / Staff ID matches */
    .highlight-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }

    .search-highlight-box {
      position: absolute;
      background-color: rgba(250, 204, 21, 0.45);
      border: 3px solid #eab308;
      border-radius: 4px;
      transition: all 0.2s ease;
    }

    .search-highlight-box.active-match {
      background-color: rgba(249, 115, 22, 0.5);
      border: 4px solid #ea580c;
      box-shadow: 0 0 18px rgba(234, 88, 12, 0.85);
    }

    .pdf-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 100%;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }

    .action-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-top: 10px;
    }

    .btn-back-round {
      width: 42px;
      height: 42px;
      border: 2px solid #0078D4;
      border-radius: 50%;
      background: white;
      color: #0078D4;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    @media (orientation: landscape) {
      .app-viewport {
        max-width: 100vw !important;
        max-height: 100vh !important;
        width: 100vw !important;
        height: 100vh !important;
        border-radius: 0 !important;
        box-shadow: none !important;
      }
      .view-screen { padding: 6px 12px !important; }
      .booking-top-nav { margin-bottom: 4px; }
      .filter-info-bar, .file-list-container, .search-bar-container {
        margin-bottom: 5px;
        padding: 4px 10px;
      }
      .pdf-card-container { border-radius: 8px; }
      .action-row { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="view-screen">
      
      <!-- Top Navigation -->
      <div class="booking-top-nav">
        <div class="btn-home-icon" onclick="goHome()">🏠</div>
        <div class="booking-header-title">MANPOWER BOOKING</div>
        <div class="btn-home-icon" onclick="forceRefresh()" title="Refresh Document">🔄</div>
      </div>

      <!-- Date Banner -->
      <div class="filter-info-bar">
        <span>📅 Today's Bookings</span>
        <span id="currentDateDisplay">--/--/----</span>
      </div>

      <!-- File Name Card -->
      <div id="fileListContainer" class="file-list-container">
        <div class="file-card" id="fileNameCard"><span>📄 Loading document...</span> <span>➔</span></div>
      </div>

      <!-- OPTION C: Search Name or Staff ID -->
      <div class="search-bar-container">
        <span>🔍</span>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search Name or Staff ID..."
          oninput="handleSearchInput()"
          onkeydown="if(event.key==='Enter'){ event.preventDefault(); nextSearchMatch(); }"
        />
        <span id="searchCount" class="search-count hidden">0 / 0</span>
        <button id="prevMatchBtn" class="search-nav-btn hidden" onclick="prevSearchMatch()" title="Previous Match">▲</button>
        <button id="nextMatchBtn" class="search-nav-btn hidden" onclick="nextSearchMatch()" title="Next Match">▼</button>
        <button id="clearSearchBtn" class="search-nav-btn hidden" onclick="clearSearch()" title="Clear Search">✕</button>
      </div>

      <!-- PDF Canvas Viewport -->
      <div class="pdf-card-container" id="pdfCardBox">
        
        <!-- OPTION A: Floating Page Counter Badge -->
        <div id="pageBadge" class="page-badge hidden">Page 1 / 1</div>

        <div id="zoomControls" class="zoom-toolbar">
          <button class="zoom-btn zoom-btn-icon" onclick="toggleLandscape()" title="Rotate 90°">↻</button>
          <button class="zoom-btn zoom-btn-icon" onclick="zoomIn()" title="Zoom In">＋</button>
          <button class="zoom-btn zoom-btn-icon" onclick="zoomOut()" title="Zoom Out">－</button>
          <button class="zoom-btn zoom-btn-100" onclick="zoomOriginalSize()" title="100% Original HD Size">100%</button>
          <button class="zoom-btn zoom-btn-text" onclick="resetZoom()" title="Fit to Screen">FIT</button>
        </div>

        <div id="pdfPlaceholder" class="pdf-placeholder">
          <div class="spinner"></div>
          <span id="statusText">Opening booking sheet...</span>
        </div>

        <div id="panzoomTarget" class="panzoom-wrapper hidden"></div>
      </div>

      <div class="action-row">
        <div class="btn-back-round" onclick="goHome()">➔</div>
      </div>

    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxP5hpOLd4u9PdCTyaOvKaM6zrqdJFuuwRFpoIAa-oULv50SFGDnFc6zsr4Qqsu6jmP/exec";

    let pdfDoc = null;
    let panzoomInstance = null;
    let isLandscape = false;
    let currentRenderedBase64 = null;
    let fitScale = 1;

    // Option A: Dynamic sharp re-rendering state
    const BASE_RENDER_SCALE = 2.5;
    let currentRenderScale = BASE_RENDER_SCALE;
    let sharpRenderTimer = null;
    let pageRecords = []; // { pageNum, page, wrapper, canvas, highlightLayer, baseWidth, baseHeight }

    // Option C: Text search index & matches
    let indexedTextItems = []; // { pageNum, str, normStr, x, y, width, height }
    let searchMatches = [];
    let currentMatchIdx = -1;

    function checkSession() {
      const activeSession = sessionStorage.getItem('userSession');
      if (!activeSession) {
        window.location.href = '../index.html';
      }
    }

    function goHome() {
      window.location.href = '../index.html';
    }

    function getDateParams() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      return {
        cacheKey: `spts_booking_pdf_${yyyy}_${mm}_${dd}`,
        formattedDisplay: `${dd}/${mm}/${yyyy}`
      };
    }

    async function fetchTodayBookings(skipCache = false) {
      const dateInfo = getDateParams();
      document.getElementById('currentDateDisplay').innerText = dateInfo.formattedDisplay;

      if (!skipCache) {
        try {
          const cachedRaw = localStorage.getItem(dateInfo.cacheKey);
          if (cachedRaw) {
            const cached = JSON.parse(cachedRaw);
            if (cached && cached.pdfBase64) {
              document.getElementById('fileNameCard').innerHTML = `<span>📄 ${cached.fileName || 'Booking Document'}</span> <span>⚡</span>`;
              currentRenderedBase64 = cached.pdfBase64;
              await renderPdfWithPanzoom(cached.pdfBase64);
              syncInBackground(dateInfo.cacheKey);
              return;
            }
          }
        } catch (e) {
          console.warn("Cache read skipped:", e);
        }
      }

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'GET',
          redirect: 'follow'
        });

        if (!response.ok) {
          showError(`HTTP Error (${response.status}): Re-deploy Web App as 'Anyone'.`);
          return;
        }

        const result = await response.json();
        if (result.pdfBase64) {
          document.getElementById('fileNameCard').innerHTML = `<span>📄 ${result.fileName || 'Booking Document'}</span> <span>➔</span>`;
          currentRenderedBase64 = result.pdfBase64;
          saveToDailyCache(dateInfo.cacheKey, result);
          await renderPdfWithPanzoom(result.pdfBase64);
        } else if (result.error) {
          showError(`Drive Error: ${result.error}`);
        } else {
          showError("No booking document found in Drive.");
        }
      } catch (err) {
        console.error("Fetch Exception:", err);
        showError("Network connection failed. Check internet or Apps Script permissions.");
      }
    }

    async function syncInBackground(cacheKey) {
      try {
        const response = await fetch(APPS_SCRIPT_URL, { method: 'GET', redirect: 'follow' });
        if (!response.ok) return;
        const result = await response.json();
        if (result.pdfBase64 && result.pdfBase64 !== currentRenderedBase64) {
          currentRenderedBase64 = result.pdfBase64;
          saveToDailyCache(cacheKey, result);
          document.getElementById('fileNameCard').innerHTML = `<span>📄 ${result.fileName || 'Booking Document'} (Updated)</span> <span>➔</span>`;
          await renderPdfWithPanzoom(result.pdfBase64);
        }
      } catch (_) {}
    }

    function saveToDailyCache(todayKey, data) {
      try {
        Object.keys(localStorage).forEach(key => {
          if (key.startsWith('spts_booking_pdf_') && key !== todayKey) {
            localStorage.removeItem(key);
          }
        });
        localStorage.setItem(todayKey, JSON.stringify({
          fileName: data.fileName,
          pdfBase64: data.pdfBase64
        }));
      } catch (e) {}
    }

    function forceRefresh() {
      clearSearch();
      const placeholder = document.getElementById('pdfPlaceholder');
      const target = document.getElementById('panzoomTarget');
      const badge = document.getElementById('pageBadge');
      target.classList.add('hidden');
      badge.classList.add('hidden');
      placeholder.classList.remove('hidden');
      placeholder.innerHTML = `<div class="spinner"></div><span>Refreshing latest booking...</span>`;
      fetchTodayBookings(true);
    }

    function showError(msg) {
      const placeholder = document.getElementById('pdfPlaceholder');
      placeholder.innerHTML = `<div style="color: #f87171; padding: 20px;">${msg}</div>`;
      placeholder.classList.remove('hidden');
    }

    async function renderPdfWithPanzoom(base64Data) {
      const target = document.getElementById('panzoomTarget');
      const placeholder = document.getElementById('pdfPlaceholder');
      const containerBox = document.getElementById('pdfCardBox');
      const pageBadge = document.getElementById('pageBadge');

      isLandscape = false;
      pageRecords = [];
      indexedTextItems = [];
      currentRenderScale = BASE_RENDER_SCALE;

      if (panzoomInstance) {
        panzoomInstance.destroy();
        panzoomInstance = null;
      }

      try {
        const cleanBase64 = base64Data.replace(/^data:application\/pdf;base64,/, "").replace(/\s/g, "");
        const binaryRes = await fetch(`data:application/pdf;base64,${cleanBase64}`);
        const pdfBuffer = await binaryRes.arrayBuffer();

        pdfDoc = await pdfjsLib.getDocument({ data: pdfBuffer }).promise;

        target.innerHTML = '';
        placeholder.classList.add('hidden');
        target.classList.remove('hidden');
        pageBadge.classList.remove('hidden');
        pageBadge.innerText = `Page 1 / ${pdfDoc.numPages}`;

        let firstPageWidth = 0;

        for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
          const page = await pdfDoc.getPage(pageNum);
          const baseViewport = page.getViewport({ scale: BASE_RENDER_SCALE });

          const wrapper = document.createElement('div');
          wrapper.className = 'pdf-page-wrapper';
          wrapper.style.width = `${baseViewport.width}px`;
          wrapper.style.height = `${baseViewport.height}px`;

          const canvas = document.createElement('canvas');
          canvas.className = 'pdf-page-canvas';
          canvas.width = baseViewport.width;
          canvas.height = baseViewport.height;

          const highlightLayer = document.createElement('div');
          highlightLayer.className = 'highlight-layer';

          wrapper.appendChild(canvas);
          wrapper.appendChild(highlightLayer);
          target.appendChild(wrapper);

          if (pageNum === 1) {
            firstPageWidth = baseViewport.width;
          }

          const record = {
            pageNum,
            page,
            wrapper,
            canvas,
            highlightLayer,
            baseWidth: baseViewport.width,
            baseHeight: baseViewport.height
          };
          pageRecords.push(record);

          // Render initial page canvas
          await page.render({
            canvasContext: canvas.getContext('2d', { alpha: false }),
            viewport: baseViewport
          }).promise;

          // Index text positions in background for instant Name / Staff ID search
          indexPageText(page, pageNum, baseViewport);
        }

        // Fit full HD page width neatly inside mobile container initially
        const boxWidth = containerBox.clientWidth - 16;
        fitScale = firstPageWidth > 0 ? Math.min(boxWidth / firstPageWidth, 1) : 0.3;

        panzoomInstance = Panzoom(target, {
          maxScale: 3.0,
          minScale: fitScale * 0.8,
          step: 0.25,
          contain: false,
          startScale: fitScale,
          canvas: true,
          cursor: 'grab',
          setTransform: (elem, { scale, x, y }) => {
            const rot = isLandscape ? 90 : 0;
            elem.style.transform = `scale(${scale}) translate(${x}px, ${y}px) rotate(${rot}deg)`;
          }
        });

        // Position top of Page 1 cleanly inside viewport
        setTimeout(() => {
          panzoomInstance.zoom(fitScale, { animate: false });
          panzoomInstance.pan(0, 0, { animate: false });
          updateVisiblePageBadge();
        }, 30);

        // OPTION A: Update page counter on pan/zoom & trigger crisp HD re-render when zoomed in deep
        target.addEventListener('panzoomchange', () => {
          updateVisiblePageBadge();
        });

        target.addEventListener('panzoomzoom', (e) => {
          const zScale = e.detail.scale;
          clearTimeout(sharpRenderTimer);
          sharpRenderTimer = setTimeout(() => {
            upgradeCanvasSharpness(zScale);
          }, 260);
        });

        containerBox.addEventListener('wheel', (e) => {
          e.preventDefault();
          panzoomInstance.zoomWithWheel(e);
        }, { passive: false });

        // OPTION A: Double-Tap Smart Zoom centered on finger tap
        setupDoubleTapZoom(containerBox);

      } catch (err) {
        console.error('PDF Render Error:', err);
        showError("Failed to render document.");
      }
    }

    // Re-renders canvas backing store at higher resolution when zoomed deeply into small cells
    async function upgradeCanvasSharpness(zoomLevel) {
      if (!pageRecords.length) return;
      // Target effective pixel density up to 4.2x original PDF points
      const desiredRenderScale = zoomLevel > 0.75 ? 4.2 : BASE_RENDER_SCALE;
      if (Math.abs(desiredRenderScale - currentRenderScale) < 0.5) return;

      currentRenderScale = desiredRenderScale;
      for (const rec of pageRecords) {
        const hdViewport = rec.page.getViewport({ scale: desiredRenderScale });
        rec.canvas.width = hdViewport.width;
        rec.canvas.height = hdViewport.height;
        await rec.page.render({
          canvasContext: rec.canvas.getContext('2d', { alpha: false }),
          viewport: hdViewport
        }).promise;
      }
    }

    // Detects which page is centered in the viewport and updates "Page X / Y"
    function updateVisiblePageBadge() {
      if (!pageRecords.length) return;
      const boxRect = document.getElementById('pdfCardBox').getBoundingClientRect();
      const boxCenterY = boxRect.top + boxRect.height / 2;

      let closestPage = 1;
      let minDistance = Infinity;

      for (const rec of pageRecords) {
        const rect = rec.wrapper.getBoundingClientRect();
        const pageCenterY = rect.top + rect.height / 2;
        const dist = Math.abs(pageCenterY - boxCenterY);
        if (dist < minDistance) {
          minDistance = dist;
          closestPage = rec.pageNum;
        }
      }

      document.getElementById('pageBadge').innerText = `Page ${closestPage} / ${pageRecords.length}`;
    }

    // Double-Tap gesture: toggles between FIT and 100% HD zoom right where user tapped
    function setupDoubleTapZoom(containerBox) {
      let lastTapTime = 0;
      let lastTapX = 0;
      let lastTapY = 0;

      containerBox.addEventListener('touchend', (e) => {
        if (e.target.closest('.zoom-toolbar')) return;
        if (e.changedTouches.length !== 1) return;

        const now = Date.now();
        const touch = e.changedTouches[0];
        const dx = Math.abs(touch.clientX - lastTapX);
        const dy = Math.abs(touch.clientY - lastTapY);

        if (now - lastTapTime < 300 && dx < 28 && dy < 28 && panzoomInstance) {
          e.preventDefault();
          const currentScale = panzoomInstance.getScale();
          if (currentScale > fitScale * 1.35) {
            resetZoom();
          } else {
            panzoomInstance.zoomToPoint(0.85, {
              clientX: touch.clientX,
              clientY: touch.clientY
            }, { animate: true });
          }
          lastTapTime = 0;
        } else {
          lastTapTime = now;
          lastTapX = touch.clientX;
          lastTapY = touch.clientY;
        }
      }, { passive: false });
    }

    /* =====================================================================
       OPTION C: TEXT EXTRACTION & NAME / STAFF ID SEARCH
       ===================================================================== */
    async function indexPageText(page, pageNum, viewport) {
      try {
        const textContent = await page.getTextContent();
        for (const item of textContent.items) {
          const str = (item.str || '').trim();
          if (!str) continue;

          // Transform PDF text coordinates into viewport pixel coordinates
          const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
          const fontHeight = Math.hypot(tx[2], tx[3]) || (item.height * viewport.scale);
          const itemWidth = (item.width * viewport.scale) || (str.length * fontHeight * 0.55);

          indexedTextItems.push({
            pageNum,
            str,
            normStr: str.toLowerCase(),
            x: tx[4],
            y: tx[5] - fontHeight,
            width: Math.max(itemWidth, 24),
            height: Math.max(fontHeight * 1.25, 16)
          });
        }
      } catch (e) {
        console.warn("Text index error on page", pageNum, e);
      }
    }

    function handleSearchInput() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const countEl = document.getElementById('searchCount');
      const prevBtn = document.getElementById('prevMatchBtn');
      const nextBtn = document.getElementById('nextMatchBtn');
      const clearBtn = document.getElementById('clearSearchBtn');

      // Clear previous highlights
      pageRecords.forEach(r => r.highlightLayer.innerHTML = '');
      searchMatches = [];
      currentMatchIdx = -1;

      if (!query) {
        countEl.classList.add('hidden');
        prevBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
        clearBtn.classList.add('hidden');
        return;
      }

      clearBtn.classList.remove('hidden');

      // Find all matching items
      for (const item of indexedTextItems) {
        if (item.normStr.includes(query)) {
          const rec = pageRecords[item.pageNum - 1];
          if (!rec) continue;

          const box = document.createElement('div');
          box.className = 'search-highlight-box';
          box.style.left = `${item.x - 4}px`;
          box.style.top = `${item.y - 2}px`;
          box.style.width = `${item.width + 8}px`;
          box.style.height = `${item.height + 4}px`;

          rec.highlightLayer.appendChild(box);
          searchMatches.push({ item, box, rec });
        }
      }

      countEl.classList.remove('hidden');
      if (searchMatches.length === 0) {
        countEl.innerText = '0 / 0';
        prevBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
      } else {
        prevBtn.classList.remove('hidden');
        nextBtn.classList.remove('hidden');
        focusSearchMatch(0);
      }
    }

    function focusSearchMatch(index) {
      if (!searchMatches.length || !panzoomInstance) return;

      searchMatches.forEach(m => m.box.classList.remove('active-match'));
      currentMatchIdx = (index + searchMatches.length) % searchMatches.length;

      const match = searchMatches[currentMatchIdx];
      match.box.classList.add('active-match');
      document.getElementById('searchCount').innerText = `${currentMatchIdx + 1} / ${searchMatches.length}`;

      // Zoom in to readable HD scale and center the matched Name / Staff ID on screen
      const targetScale = Math.max(0.85, fitScale * 2.2);
      const targetEl = document.getElementById('panzoomTarget');
      const totalWidth = targetEl.offsetWidth;
      const totalHeight = targetEl.offsetHeight;

      const matchCenterX = match.rec.wrapper.offsetLeft + match.item.x + (match.item.width / 2);
      const matchCenterY = match.rec.wrapper.offsetTop + match.item.y + (match.item.height / 2);

      // Offset from center of panzoomTarget
      const panX = (totalWidth / 2) - matchCenterX;
      const panY = (totalHeight / 2) - matchCenterY;

      panzoomInstance.zoom(targetScale, { animate: true });
      setTimeout(() => {
        panzoomInstance.pan(panX, panY, { animate: true });
        updateVisiblePageBadge();
      }, 60);
    }

    function nextSearchMatch() {
      if (searchMatches.length) focusSearchMatch(currentMatchIdx + 1);
    }

    function prevSearchMatch() {
      if (searchMatches.length) focusSearchMatch(currentMatchIdx - 1);
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      handleSearchInput();
    }

    /* =====================================================================
       TOOLBAR CONTROLS
       ===================================================================== */
    function zoomOriginalSize() {
      if (!panzoomInstance) return;
      panzoomInstance.zoom(0.85, { animate: true });
    }

    function toggleLandscape() {
      if (!panzoomInstance) return;
      isLandscape = !isLandscape;
      const currentScale = panzoomInstance.getScale();
      panzoomInstance.zoom(currentScale, { animate: true });
    }

    function zoomIn() {
      if (panzoomInstance) panzoomInstance.zoomIn({ animate: true });
    }

    function zoomOut() {
      if (panzoomInstance) panzoomInstance.zoomOut({ animate: true });
    }

    function resetZoom() {
      isLandscape = false;
      if (panzoomInstance) {
        panzoomInstance.zoom(fitScale, { animate: true });
        panzoomInstance.pan(0, 0, { animate: true });
      }
    }

    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        if (!panzoomInstance || !pageRecords.length) return;
        const containerBox = document.getElementById('pdfCardBox');
        fitScale = Math.min((containerBox.clientWidth - 16) / pageRecords[0].baseWidth, 1);
        resetZoom();
      }, 250);
    });

    document.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('DOMContentLoaded', () => {
      checkSession();
      fetchTodayBookings();
    });
  </script>

  <script src="../js/fullscreen-global.js"></script>
