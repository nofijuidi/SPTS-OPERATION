<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
  <title>SPTS - Manpower Booking</title>
  <meta name="theme-color" content="#0f172a">

  <!-- Mobile Full-Screen Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Preconnect to CDNs & Google Script -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="preconnect" href="https://script.google.com" crossorigin>

  <!-- High Definition PDF Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    input {
      -webkit-user-select: text !important;
      user-select: text !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #334155;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .app-viewport {
      width: 100vw;
      height: 100vh;
      max-width: 412px;
      max-height: 892px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    @media (min-width: 480px) and (orientation: portrait) {
      .app-viewport {
        border-radius: 28px;
        height: 844px;
      }
    }

    .view-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      overflow: hidden;
      gap: 8px;
    }

    .booking-top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .btn-home-icon {
      width: 36px;
      height: 36px;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      color: #002060;
    }

    .booking-header-title {
      flex: 1;
      text-align: center;
      color: #002060;
      font-size: 16px;
      font-weight: 800;
    }

    .status-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      color: #1e40af;
      flex-shrink: 0;
    }

    .file-name-text {
      color: #0078D4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 62%;
    }

    .search-bar-container {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: #ffffff;
      border: 2px solid #0078D4;
      border-radius: 10px;
      padding: 6px 10px;
      flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0, 120, 212, 0.12);
    }

    .search-input {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
      outline: none;
    }

    .search-input::placeholder {
      color: #64748b;
      font-weight: 500;
    }

    .search-count {
      font-size: 11px;
      font-weight: 800;
      color: #0f172a;
      background: #fef08a;
      border: 1px solid #eab308;
      padding: 2px 6px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .search-nav-btn {
      width: 28px;
      height: 28px;
      border: 1px solid #cbd5e1;
      background: #f1f5f9;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      color: #0f172a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-nav-btn:active {
      background: #cbd5e1;
    }

    /* STATIC VIEWPORT BOX */
    .pdf-card-container {
      flex: 1;
      width: 100%;
      border: 1.5px solid #0078D4;
      border-radius: 12px;
      overflow: hidden;
      background-color: #525659;
      position: relative;
      touch-action: none;
    }

    .page-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 50;
      background: rgba(15, 23, 42, 0.85);
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      pointer-events: none;
    }

    .zoom-toolbar {
      position: absolute;
      bottom: 8px;
      left: 8px;
      right: 8px;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: rgba(15, 23, 42, 0.85);
      padding: 6px 8px;
      border-radius: 10px;
      backdrop-filter: blur(4px);
    }

    .zoom-btn {
      height: 36px;
      background: #ffffff;
      border: 1px solid #0f172a;
      border-radius: 8px;
      font-weight: 800;
      font-size: 15px;
      color: #0f172a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      flex: 1;
    }

    .zoom-btn-icon {
      min-width: 38px;
      max-width: 44px;
    }

    .zoom-btn-100 {
      font-size: 12px;
      font-weight: 900;
      background-color: #e0f2fe;
      border-color: #0284c7;
      color: #0369a1;
      flex: 1.2;
    }

    .zoom-btn-text {
      font-size: 12px;
      font-weight: 900;
      background-color: #fef3c7;
      border-color: #d97706;
      color: #0f172a;
      flex: 1.2;
    }

    .zoom-btn:active {
      background: #e2e8f0;
      transform: scale(0.95);
    }

    /* TOP-LEFT ORIGIN MATRIX LAYER FOR EXACT 1:1 PINCH & CLAMPING */
    .panzoom-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      cursor: grab;
      display: flex;
      flex-direction: column;
      align-items: center;
      touch-action: none;
      will-change: transform;
    }

    .panzoom-wrapper.smooth-anim {
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .panzoom-wrapper:active {
      cursor: grabbing;
    }

    .pdf-page-wrapper {
      position: relative;
      margin: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      border-radius: 4px;
      background-color: #ffffff;
      touch-action: none;
    }

    canvas.pdf-page-canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 4px;
      touch-action: none;
    }

    .highlight-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }

    .search-highlight-box {
      position: absolute;
      background-color: rgba(250, 204, 21, 0.45);
      border: 3px solid #eab308;
      border-radius: 4px;
    }

    .search-highlight-box.active-match {
      background-color: rgba(249, 115, 22, 0.52);
      border: 5px solid #ea580c;
      box-shadow: 0 0 22px rgba(234, 88, 12, 0.95);
    }

    .pdf-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 100%;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none !important;
    }

    @media (orientation: landscape) {
      .app-viewport {
        max-width: 100vw !important;
        max-height: 100vh !important;
        width: 100vw !important;
        height: 100vh !important;
        border-radius: 0 !important;
        box-shadow: none !important;
      }
      .view-screen {
        padding: 6px 10px !important;
        gap: 5px;
      }
      .status-strip, .search-bar-container {
        padding: 4px 8px;
      }
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="view-screen">
      
      <!-- Top Navigation -->
      <div class="booking-top-nav">
        <div class="btn-home-icon" onclick="goHome()" title="Home">🏠</div>
        <div class="booking-header-title">MANPOWER BOOKING</div>
        <div class="btn-home-icon" onclick="forceRefresh()" title="Refresh Document">🔄</div>
      </div>

      <!-- Compact Date & File Name Strip -->
      <div class="status-strip">
        <span id="fileNameCard" class="file-name-text">📄 Loading...</span>
        <span id="currentDateDisplay">📅 --/--/----</span>
      </div>

      <!-- Search Name or Staff ID Bar -->
      <div class="search-bar-container">
        <span>🔍</span>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Search Name or Staff ID..."
          oninput="handleSearchInput()"
          onkeydown="if(event.key==='Enter'){ event.preventDefault(); nextSearchMatch(); }"
        />
        <span id="searchCount" class="search-count hidden">0/0</span>
        <button id="prevMatchBtn" class="search-nav-btn hidden" onclick="prevSearchMatch()" title="Previous">▲</button>
        <button id="nextMatchBtn" class="search-nav-btn hidden" onclick="nextSearchMatch()" title="Next">▼</button>
        <button id="clearSearchBtn" class="search-nav-btn hidden" onclick="clearSearch()" title="Clear">✕</button>
      </div>

      <!-- PDF Canvas Viewport -->
      <div class="pdf-card-container" id="pdfCardBox">
        <div id="pageBadge" class="page-badge hidden">Page 1 / 1</div>

        <div id="zoomControls" class="zoom-toolbar">
          <button class="zoom-btn zoom-btn-icon" onclick="toggleLandscape()" title="Rotate 90°">↻</button>
          <button class="zoom-btn zoom-btn-icon" onclick="zoomIn()" title="Zoom In">＋</button>
          <button class="zoom-btn zoom-btn-icon" onclick="zoomOut()" title="Zoom Out">－</button>
          <button class="zoom-btn zoom-btn-100" onclick="zoomOriginalSize()" title="100% HD Size">100%</button>
          <button class="zoom-btn zoom-btn-text" onclick="resetZoom()" title="Fit to Screen">FIT</button>
        </div>

        <div id="pdfPlaceholder" class="pdf-placeholder">
          <div class="spinner"></div>
          <span id="statusText">Opening booking sheet...</span>
        </div>

        <div id="panzoomTarget" class="panzoom-wrapper hidden"></div>
      </div>

    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxP5hpOLd4u9PdCTyaOvKaM6zrqdJFuuwRFpoIAa-oULv50SFGDnFc6zsr4Qqsu6jmP/exec";

    let pdfDoc = null;
    let isLandscape = false;
    let currentRenderedBase64 = null;
    let fitScale = 1;

    const BASE_RENDER_SCALE = 2.5;
    let currentRenderScale = BASE_RENDER_SCALE;
    let sharpRenderTimer = null;
    let pageRecords = [];

    let indexedTextItems = [];
    let searchMatches = [];
    let currentMatchIdx = -1;

    // =========================================================================
    // PRECISION VIEWPORT MATRIX STATE (0,0 Top-Left Origin)
    // =========================================================================
    const viewState = {
      scale: 1,
      tx: 0,
      ty: 0,
      minScale: 0.2,
      maxScale: 4.5,
      contentW: 0,
      contentH: 0
    };

    function applyTransform(animate = false) {
      const target = document.getElementById('panzoomTarget');
      if (!target) return;

      clampToViewport();

      if (animate) {
        target.classList.add('smooth-anim');
      } else {
        target.classList.remove('smooth-anim');
      }

      target.style.transform = `translate(${viewState.tx}px, ${viewState.ty}px) scale(${viewState.scale})`;
      updateVisiblePageBadge();

      clearTimeout(sharpRenderTimer);
      sharpRenderTimer = setTimeout(() => {
        upgradeCanvasSharpness(viewState.scale);
      }, 260);
    }

    // Ensures the PDF ALWAYS stays inside the visible box and never flies off-screen
    function clampToViewport() {
      const box = document.getElementById('pdfCardBox');
      if (!box || !viewState.contentW || !viewState.contentH) return;

      const boxW = box.clientWidth;
      const boxH = box.clientHeight;
      const toolbarReserve = 52; // keep bottom readable above toolbar
      const usableH = Math.max(boxH - toolbarReserve, 120);

      const scaledW = viewState.contentW * viewState.scale;
      const scaledH = viewState.contentH * viewState.scale;

      // Horizontal clamping: center if narrower than viewport, otherwise keep edges locked to viewport bounds
      if (scaledW <= boxW) {
        viewState.tx = (boxW - scaledW) / 2;
      } else {
        const minTx = boxW - scaledW - 12;
        const maxTx = 12;
        viewState.tx = Math.min(Math.max(viewState.tx, minTx), maxTx);
      }

      // Vertical clamping: start near top if shorter than viewport, otherwise keep top/bottom inside viewport
      if (scaledH <= usableH) {
        viewState.ty = 8;
      } else {
        const minTy = usableH - scaledH - 12;
        const maxTy = 12;
        viewState.ty = Math.min(Math.max(viewState.ty, minTy), maxTy);
      }
    }

    // Zooms around an exact screen coordinate (clientX, clientY) so that point never moves under your finger(s)
    function zoomAtClientPoint(newScale, clientX, clientY, animate = false) {
      const box = document.getElementById('pdfCardBox');
      if (!box) return;

      const clampedScale = Math.min(Math.max(newScale, viewState.minScale), viewState.maxScale);
      const rect = box.getBoundingClientRect();

      // Screen point relative to viewport box
      const sx = clientX - rect.left;
      const sy = clientY - rect.top;

      // Convert screen point to unscaled PDF content coordinate BEFORE zoom
      const pdfX = (sx - viewState.tx) / viewState.scale;
      const pdfY = (sy - viewState.ty) / viewState.scale;

      // Update scale and solve for new tx, ty so (pdfX, pdfY) stays at exact (sx, sy)
      viewState.scale = clampedScale;
      viewState.tx = sx - pdfX * clampedScale;
      viewState.ty = sy - pdfY * clampedScale;

      applyTransform(animate);
    }

    // =========================================================================
    // NATIVE 1-FINGER PAN + 2-FINGER ANCHORED PINCH CONTROLLER
    // =========================================================================
    function initTouchAndMouseGestures() {
      const box = document.getElementById('pdfCardBox');
      let mode = 'none'; // 'pan' | 'pinch'
      let startPanX = 0;
      let startPanY = 0;
      let startTx = 0;
      let startTy = 0;

      // Pinch anchor state
      let initialPinchDist = 0;
      let initialPinchScale = 1;
      let anchorPdfX = 0;
      let anchorPdfY = 0;

      // Double-tap state
      let lastTapTime = 0;
      let lastTapX = 0;
      let lastTapY = 0;

      function getDistance(t1, t2) {
        return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      }

      function getMidpoint(t1, t2) {
        return {
          x: (t1.clientX + t2.clientX) / 2,
          y: (t1.clientY + t2.clientY) / 2
        };
      }

      box.addEventListener('touchstart', (e) => {
        if (e.target.closest('.zoom-toolbar')) return;

        if (e.touches.length === 1) {
          mode = 'pan';
          startPanX = e.touches[0].clientX;
          startPanY = e.touches[0].clientY;
          startTx = viewState.tx;
          startTy = viewState.ty;
        } else if (e.touches.length === 2) {
          e.preventDefault();
          mode = 'pinch';
          const t1 = e.touches[0];
          const t2 = e.touches[1];
          initialPinchDist = Math.max(getDistance(t1, t2), 1);
          initialPinchScale = viewState.scale;

          // Record exact PDF coordinate under the midpoint of Finger A & Finger B
          // When one finger stays still and the other moves, the midpoint shifts by half
          // the moving finger's delta—locking the stationary finger's PDF spot in place!
          const mid = getMidpoint(t1, t2);
          const rect = box.getBoundingClientRect();
          const sx = mid.x - rect.left;
          const sy = mid.y - rect.top;
          anchorPdfX = (sx - viewState.tx) / viewState.scale;
          anchorPdfY = (sy - viewState.ty) / viewState.scale;
        }
      }, { passive: false });

      box.addEventListener('touchmove', (e) => {
        if (e.target.closest('.zoom-toolbar')) return;

        if (mode === 'pan' && e.touches.length === 1) {
          e.preventDefault();
          const dx = e.touches[0].clientX - startPanX;
          const dy = e.touches[0].clientY - startPanY;
          viewState.tx = startTx + dx;
          viewState.ty = startTy + dy;
          applyTransform(false);
        } else if (mode === 'pinch' && e.touches.length === 2) {
          e.preventDefault();
          const t1 = e.touches[0];
          const t2 = e.touches[1];
          const dist = getDistance(t1, t2);
          const ratio = dist / initialPinchDist;
          const nextScale = Math.min(Math.max(initialPinchScale * ratio, viewState.minScale), viewState.maxScale);

          const mid = getMidpoint(t1, t2);
          const rect = box.getBoundingClientRect();
          const sx = mid.x - rect.left;
          const sy = mid.y - rect.top;

          viewState.scale = nextScale;
          viewState.tx = sx - anchorPdfX * nextScale;
          viewState.ty = sy - anchorPdfY * nextScale;

          applyTransform(false);
        }
      }, { passive: false });

      box.addEventListener('touchend', (e) => {
        if (e.target.closest('.zoom-toolbar')) return;

        // Smooth handoff if 1 finger remains after lifting 2nd finger
        if (e.touches.length === 1) {
          mode = 'pan';
          startPanX = e.touches[0].clientX;
          startPanY = e.touches[0].clientY;
          startTx = viewState.tx;
          startTy = viewState.ty;
          return;
        }

        if (e.touches.length === 0) {
          // Check double-tap only when ending a single-finger tap
          if (mode === 'pan' && e.changedTouches.length === 1) {
            const touch = e.changedTouches[0];
            const moveDist = Math.hypot(touch.clientX - startPanX, touch.clientY - startPanY);
            if (moveDist < 12) {
              const now = Date.now();
              const dt = now - lastTapTime;
              const tapDist = Math.hypot(touch.clientX - lastTapX, touch.clientY - lastTapY);

              if (dt < 300 && tapDist < 28) {
                e.preventDefault();
                if (viewState.scale > fitScale * 1.4) {
                  resetZoom();
                } else {
                  zoomAtClientPoint(Math.min(fitScale * 3.2, 2.0), touch.clientX, touch.clientY, true);
                }
                lastTapTime = 0;
              } else {
                lastTapTime = now;
                lastTapX = touch.clientX;
                lastTapY = touch.clientY;
              }
            }
          }
          mode = 'none';
        }
      }, { passive: false });

      // Desktop / Mouse drag & wheel support
      let isMouseDown = false;
      box.addEventListener('mousedown', (e) => {
        if (e.target.closest('.zoom-toolbar')) return;
        isMouseDown = true;
        startPanX = e.clientX;
        startPanY = e.clientY;
        startTx = viewState.tx;
        startTy = viewState.ty;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isMouseDown) return;
        viewState.tx = startTx + (e.clientX - startPanX);
        viewState.ty = startTy + (e.clientY - startPanY);
        applyTransform(false);
      });

      window.addEventListener('mouseup', () => {
        isMouseDown = false;
      });

      box.addEventListener('wheel', (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.18 : 0.85;
        zoomAtClientPoint(viewState.scale * factor, e.clientX, e.clientY, false);
      }, { passive: false });
    }

    // =========================================================================
    // DATA FETCH & CACHING
    // =========================================================================
    function checkSession() {
      const activeSession = sessionStorage.getItem('userSession');
      if (!activeSession) {
        window.location.href = '../index.html';
      }
    }

    function goHome() {
      window.location.href = '../index.html';
    }

    function getDateParams() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      return {
        cacheKey: `spts_booking_pdf_${yyyy}_${mm}_${dd}`,
        formattedDisplay: `📅 ${dd}/${mm}/${yyyy}`
      };
    }

    async function fetchTodayBookings(skipCache = false) {
      const dateInfo = getDateParams();
      document.getElementById('currentDateDisplay').innerText = dateInfo.formattedDisplay;

      if (!skipCache) {
        try {
          const cachedRaw = localStorage.getItem(dateInfo.cacheKey);
          if (cachedRaw) {
            const cached = JSON.parse(cachedRaw);
            if (cached && cached.pdfBase64) {
              document.getElementById('fileNameCard').innerText = `📄 ${cached.fileName || 'Booking Document'}`;
              currentRenderedBase64 = cached.pdfBase64;
              await renderPdfDocument(cached.pdfBase64);
              syncInBackground(dateInfo.cacheKey);
              return;
            }
          }
        } catch (e) {
          console.warn("Cache read skipped:", e);
        }
      }

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'GET',
          redirect: 'follow'
        });

        if (!response.ok) {
          showError(`HTTP Error (${response.status}): Re-deploy Web App as 'Anyone'.`);
          return;
        }

        const result = await response.json();
        if (result.pdfBase64) {
          document.getElementById('fileNameCard').innerText = `📄 ${result.fileName || 'Booking Document'}`;
          currentRenderedBase64 = result.pdfBase64;
          saveToDailyCache(dateInfo.cacheKey, result);
          await renderPdfDocument(result.pdfBase64);
        } else if (result.error) {
          showError(`Drive Error: ${result.error}`);
        } else {
          showError("No booking document found in Drive.");
        }
      } catch (err) {
        console.error("Fetch Exception:", err);
        showError("Network connection failed. Check internet or Apps Script permissions.");
      }
    }

    async function syncInBackground(cacheKey) {
      try {
        const response = await fetch(APPS_SCRIPT_URL, { method: 'GET', redirect: 'follow' });
        if (!response.ok) return;
        const result = await response.json();
        if (result.pdfBase64 && result.pdfBase64 !== currentRenderedBase64) {
          currentRenderedBase64 = result.pdfBase64;
          saveToDailyCache(cacheKey, result);
          document.getElementById('fileNameCard').innerText = `📄 ${result.fileName || 'Booking Document'} (Updated)`;
          await renderPdfDocument(result.pdfBase64);
        }
      } catch (_) {}
    }

    function saveToDailyCache(todayKey, data) {
      try {
        Object.keys(localStorage).forEach(key => {
          if (key.startsWith('spts_booking_pdf_') && key !== todayKey) {
            localStorage.removeItem(key);
          }
        });
        localStorage.setItem(todayKey, JSON.stringify({
          fileName: data.fileName,
          pdfBase64: data.pdfBase64
        }));
      } catch (e) {}
    }

    function forceRefresh() {
      clearSearch();
      const placeholder = document.getElementById('pdfPlaceholder');
      const target = document.getElementById('panzoomTarget');
      const badge = document.getElementById('pageBadge');
      target.classList.add('hidden');
      badge.classList.add('hidden');
      placeholder.classList.remove('hidden');
      placeholder.innerHTML = `<div class="spinner"></div><span>Refreshing latest booking...</span>`;
      fetchTodayBookings(true);
    }

    function showError(msg) {
      const placeholder = document.getElementById('pdfPlaceholder');
      placeholder.innerHTML = `<div style="color: #f87171; padding: 20px;">${msg}</div>`;
      placeholder.classList.remove('hidden');
    }

    // =========================================================================
    // PDF RENDERING & ROTATION
    // =========================================================================
    async function renderPdfDocument(base64Data) {
      const target = document.getElementById('panzoomTarget');
      const placeholder = document.getElementById('pdfPlaceholder');
      const containerBox = document.getElementById('pdfCardBox');
      const pageBadge = document.getElementById('pageBadge');

      pageRecords = [];
      indexedTextItems = [];
      currentRenderScale = BASE_RENDER_SCALE;

      try {
        const cleanBase64 = base64Data.replace(/^data:application\/pdf;base64,/, "").replace(/\s/g, "");
        const binaryRes = await fetch(`data:application/pdf;base64,${cleanBase64}`);
        const pdfBuffer = await binaryRes.arrayBuffer();

        pdfDoc = await pdfjsLib.getDocument({ data: pdfBuffer }).promise;
        await buildPages(isLandscape ? 90 : 0);

        placeholder.classList.add('hidden');
        target.classList.remove('hidden');
        pageBadge.classList.remove('hidden');

        // Measure full content dimensions
        viewState.contentW = target.scrollWidth;
        viewState.contentH = target.scrollHeight;

        const firstPageWidth = pageRecords[0]?.baseWidth || 1000;
        const boxWidth = containerBox.clientWidth - 20;
        fitScale = Math.min(boxWidth / firstPageWidth, 1);

        viewState.minScale = fitScale * 0.85;
        viewState.maxScale = 4.5;
        viewState.scale = fitScale;
        viewState.tx = 0;
        viewState.ty = 8;

        applyTransform(false);

      } catch (err) {
        console.error('PDF Render Error:', err);
        showError("Failed to render document.");
      }
    }

    async function buildPages(extraRotation = 0) {
      const target = document.getElementById('panzoomTarget');
      target.innerHTML = '';
      pageRecords = [];
      indexedTextItems = [];

      for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
        const page = await pdfDoc.getPage(pageNum);
        const totalRotation = (page.rotate + extraRotation) % 360;
        const baseViewport = page.getViewport({ scale: BASE_RENDER_SCALE, rotation: totalRotation });

        const wrapper = document.createElement('div');
        wrapper.className = 'pdf-page-wrapper';
        wrapper.style.width = `${baseViewport.width}px`;
        wrapper.style.height = `${baseViewport.height}px`;

        const canvas = document.createElement('canvas');
        canvas.className = 'pdf-page-canvas';
        canvas.width = baseViewport.width;
        canvas.height = baseViewport.height;

        const highlightLayer = document.createElement('div');
        highlightLayer.className = 'highlight-layer';

        wrapper.appendChild(canvas);
        wrapper.appendChild(highlightLayer);
        target.appendChild(wrapper);

        pageRecords.push({
          pageNum,
          page,
          totalRotation,
          wrapper,
          canvas,
          highlightLayer,
          baseWidth: baseViewport.width,
          baseHeight: baseViewport.height
        });

        await page.render({
          canvasContext: canvas.getContext('2d', { alpha: false }),
          viewport: baseViewport
        }).promise;

        await indexPageText(page, pageNum, baseViewport);
      }
    }

    async function upgradeCanvasSharpness(zoomLevel) {
      if (!pageRecords.length) return;
      const desiredRenderScale = zoomLevel > 0.7 ? 4.2 : BASE_RENDER_SCALE;
      if (Math.abs(desiredRenderScale - currentRenderScale) < 0.5) return;

      currentRenderScale = desiredRenderScale;
      for (const rec of pageRecords) {
        const hdViewport = rec.page.getViewport({ scale: desiredRenderScale, rotation: rec.totalRotation });
        rec.canvas.width = hdViewport.width;
        rec.canvas.height = hdViewport.height;
        await rec.page.render({
          canvasContext: rec.canvas.getContext('2d', { alpha: false }),
          viewport: hdViewport
        }).promise;
      }
    }

    function updateVisiblePageBadge() {
      if (!pageRecords.length) return;
      const boxRect = document.getElementById('pdfCardBox').getBoundingClientRect();
      const boxCenterY = boxRect.top + boxRect.height / 2;

      let closestPage = 1;
      let minDistance = Infinity;

      for (const rec of pageRecords) {
        const rect = rec.wrapper.getBoundingClientRect();
        const pageCenterY = rect.top + rect.height / 2;
        const dist = Math.abs(pageCenterY - boxCenterY);
        if (dist < minDistance) {
          minDistance = dist;
          closestPage = rec.pageNum;
        }
      }

      document.getElementById('pageBadge').innerText = `Page ${closestPage} / ${pageRecords.length}`;
    }

    // =========================================================================
    // NAME / STAFF ID SEARCH & 4X DEEP AUTO-ZOOM
    // =========================================================================
    async function indexPageText(page, pageNum, viewport) {
      try {
        const textContent = await page.getTextContent();
        for (const item of textContent.items) {
          const str = (item.str || '').trim();
          if (!str) continue;

          const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
          const fontHeight = Math.hypot(tx[2], tx[3]) || (item.height * viewport.scale);
          const itemWidth = (item.width * viewport.scale) || (str.length * fontHeight * 0.55);

          indexedTextItems.push({
            pageNum,
            str,
            normStr: str.toLowerCase(),
            x: tx[4],
            y: tx[5] - fontHeight,
            width: Math.max(itemWidth, 24),
            height: Math.max(fontHeight * 1.25, 16)
          });
        }
      } catch (e) {
        console.warn("Text index error on page", pageNum, e);
      }
    }

    function handleSearchInput() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const countEl = document.getElementById('searchCount');
      const prevBtn = document.getElementById('prevMatchBtn');
      const nextBtn = document.getElementById('nextMatchBtn');
      const clearBtn = document.getElementById('clearSearchBtn');

      pageRecords.forEach(r => r.highlightLayer.innerHTML = '');
      searchMatches = [];
      currentMatchIdx = -1;

      if (!query) {
        countEl.classList.add('hidden');
        prevBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
        clearBtn.classList.add('hidden');
        return;
      }

      clearBtn.classList.remove('hidden');

      for (const item of indexedTextItems) {
        if (item.normStr.includes(query)) {
          const rec = pageRecords[item.pageNum - 1];
          if (!rec) continue;

          const box = document.createElement('div');
          box.className = 'search-highlight-box';
          box.style.left = `${item.x - 4}px`;
          box.style.top = `${item.y - 2}px`;
          box.style.width = `${item.width + 8}px`;
          box.style.height = `${item.height + 4}px`;

          rec.highlightLayer.appendChild(box);
          searchMatches.push({ item, box, rec });
        }
      }

      countEl.classList.remove('hidden');
      if (searchMatches.length === 0) {
        countEl.innerText = '0/0';
        prevBtn.classList.add('hidden');
        nextBtn.classList.add('hidden');
      } else {
        prevBtn.classList.remove('hidden');
        nextBtn.classList.remove('hidden');
        focusSearchMatch(0);
      }
    }

    function focusSearchMatch(index) {
      if (!searchMatches.length) return;

      searchMatches.forEach(m => m.box.classList.remove('active-match'));
      currentMatchIdx = (index + searchMatches.length) % searchMatches.length;

      const match = searchMatches[currentMatchIdx];
      match.box.classList.add('active-match');
      document.getElementById('searchCount').innerText = `${currentMatchIdx + 1}/${searchMatches.length}`;

      const box = document.getElementById('pdfCardBox');
      const boxW = box.clientWidth;
      const usableH = box.clientHeight - 52;

      // Zoom 4x deeper than fitScale so the matched row is large and readable immediately
      const targetScale = Math.min(Math.max(fitScale * 4.5, 1.35), viewState.maxScale);

      // Exact center of the highlighted Name / ID in unscaled PDF coordinates
      const matchPdfX = match.rec.wrapper.offsetLeft + match.item.x + (match.item.width / 2);
      const matchPdfY = match.rec.wrapper.offsetTop + match.item.y + (match.item.height / 2);

      // Place the matched coordinate right in the center of the visible viewport
      viewState.scale = targetScale;
      viewState.tx = (boxW / 2) - (matchPdfX * targetScale);
      viewState.ty = (usableH / 2) - (matchPdfY * targetScale);

      applyTransform(true);
    }

    function nextSearchMatch() {
      if (searchMatches.length) focusSearchMatch(currentMatchIdx + 1);
    }

    function prevSearchMatch() {
      if (searchMatches.length) focusSearchMatch(currentMatchIdx - 1);
    }

    function clearSearch() {
      const input = document.getElementById('searchInput');
      input.value = '';
      handleSearchInput();
    }

    // =========================================================================
    // TOOLBAR BUTTON ACTIONS
    // =========================================================================
    function getViewportCenterClient() {
      const rect = document.getElementById('pdfCardBox').getBoundingClientRect();
      return { x: rect.left + rect.width / 2, y: rect.top + (rect.height - 52) / 2 };
    }

    function zoomOriginalSize() {
      const c = getViewportCenterClient();
      zoomAtClientPoint(1.0, c.x, c.y, true);
    }

    async function toggleLandscape() {
      if (!pdfDoc) return;
      isLandscape = !isLandscape;
      const target = document.getElementById('panzoomTarget');
      const containerBox = document.getElementById('pdfCardBox');

      await buildPages(isLandscape ? 90 : 0);
      viewState.contentW = target.scrollWidth;
      viewState.contentH = target.scrollHeight;

      const firstPageWidth = pageRecords[0]?.baseWidth || 1000;
      fitScale = Math.min((containerBox.clientWidth - 20) / firstPageWidth, 1);
      viewState.minScale = fitScale * 0.85;
      viewState.scale = fitScale;
      viewState.tx = 0;
      viewState.ty = 8;

      applyTransform(false);
      if (document.getElementById('searchInput').value.trim()) {
        handleSearchInput();
      }
    }

    function zoomIn() {
      const c = getViewportCenterClient();
      zoomAtClientPoint(viewState.scale * 1.35, c.x, c.y, true);
    }

    function zoomOut() {
      const c = getViewportCenterClient();
      zoomAtClientPoint(viewState.scale * 0.74, c.x, c.y, true);
    }

    function resetZoom() {
      viewState.scale = fitScale;
      viewState.tx = 0;
      viewState.ty = 8;
      applyTransform(true);
    }

    window.addEventListener('orientationchange', () => {
      setTimeout(() => {
        if (!pageRecords.length) return;
        const containerBox = document.getElementById('pdfCardBox');
        fitScale = Math.min((containerBox.clientWidth - 20) / pageRecords[0].baseWidth, 1);
        viewState.minScale = fitScale * 0.85;
        resetZoom();
      }, 250);
    });

    document.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('DOMContentLoaded', () => {
      checkSession();
      initTouchAndMouseGestures();
      fetchTodayBookings();
    });
  </script>

  <script src="../js/fullscreen-global.js"></script>
</body>
