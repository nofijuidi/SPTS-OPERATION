<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SPTS - Operations Portal Login</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-touch-callout: none !important;
      -webkit-user-select: none !important;
      -khtml-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
    }

    input, textarea, select {
      -webkit-user-select: text !important;
      user-select: text !important;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #334155;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .app-viewport {
      width: 100vw;
      height: 100%;
      height: 100dvh;
      height: calc(var(--vh, 1vh) * 100);
      max-width: 412px;
      max-height: 892px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    @media (min-width: 480px) and (orientation: portrait) {
      .app-viewport {
        border-radius: 28px;
        height: 844px;
      }
    }

    @media (orientation: landscape) {
      .app-viewport {
        max-width: 100vw !important;
        max-height: 100vh !important;
        border-radius: 0 !important;
        width: 100vw;
        height: 100vh;
      }
    }

    .view-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: calc(env(safe-area-inset-top, 0px) + 16px) 18px calc(env(safe-area-inset-bottom, 0px) + 16px) 18px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }

    .hidden {
      display: none !important;
    }

    /* Logo & Header */
    .login-header-card {
      text-align: center;
      margin-bottom: 24px;
      padding-top: 4px;
    }

    .app-logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      object-fit: cover;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .portal-main-title {
      font-size: 22px;
      font-weight: 900;
      color: #0b2545;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .portal-sub-title {
      font-size: 13px;
      color: #64748b;
      font-weight: 600;
      margin-top: 2px;
    }

    /* Form Inputs */
    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 13px;
      font-weight: 800;
      color: #0b2545;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #0078D4;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      color: #0f172a;
      outline: none;
      background-color: #ffffff;
      height: 50px;
    }

    .form-input:focus {
      border-color: #08506b;
      box-shadow: 0 0 0 3px rgba(8, 80, 107, 0.15);
    }

    .btn-login {
      width: 100%;
      height: 52px;
      background-color: #08506b;
      color: #ffffff;
      font-size: 17px;
      font-weight: 900;
      border: none;
      border-radius: 14px;
      margin-top: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
      transition: transform 0.15s ease, background-color 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:active {
      transform: scale(0.98);
      background-color: #063c50;
    }

    .btn-login:disabled {
      background-color: #94a3b8;
      cursor: not-allowed;
    }

    /* Alert Boxes */
    .error-card {
      background-color: #fef2f2;
      border: 1.5px solid #fca5a5;
      border-radius: 12px;
      padding: 12px;
      color: #991b1b;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 16px;
      text-align: center;
      line-height: 1.4;
    }

    /* iOS PWA Helper Banner */
    .ios-install-banner {
      position: absolute;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      left: 12px;
      right: 12px;
      background: #1e293b;
      color: #ffffff;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      z-index: 1000;
    }

    .ios-banner-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .ios-close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    <div class="view-screen">

      <div class="login-header-card">
        <img src="icon-192.png" alt="SPTS Logo" class="app-logo" onerror="this.style.display='none'" />
        <div class="portal-main-title">SPTS PORTAL</div>
        <div class="portal-sub-title">Sign in to access operational tools</div>
      </div>

      <!-- Error Notification Box -->
      <div id="errorBox" class="error-card hidden"></div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleAuthSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="usernameInput">Company ID / Username</label>
          <input type="text" id="usernameInput" class="form-input" placeholder="e.g. T5218" required autocomplete="username" />
        </div>

        <div class="form-group">
          <label class="form-label" for="passwordInput">Password</label>
          <input type="password" id="passwordInput" class="form-input" placeholder="Enter password" required autocomplete="current-password" />
        </div>

        <button type="submit" id="btnLoginSubmit" class="btn-login">
          <span>Sign In</span>
        </button>
      </form>

    </div>

    <!-- iOS PWA Helper Banner -->
    <div id="iosPrompt" class="ios-install-banner hidden">
      <div class="ios-banner-header">
        <span>Install App on iPhone</span>
        <button class="ios-close-btn" onclick="dismissIosPrompt()">×</button>
      </div>
      <div>
        Tap the <strong>Share</strong> button below (⬆️) and select <strong>'Add to Home Screen'</strong> to install.
      </div>
    </div>
  </div>

  <script>
    // Power Automate Direct HTTP Flow URL for Authentication Revalidation
    const AUTH_FLOW_URL = "https://default227dccee4218411f91e74dabddf0f5.f8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/08/workflows/d7ac73d3d7d7423eb077a2895b0738df/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=OLDn8ig2sbXDzxKke7ijuD4cLHTaQS-3v2oVkSIDrMw";

    function getPropValue(obj, keys, defaultValue = '') {
      if (!obj) return defaultValue;
      for (const k of keys) {
        if (obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== '') return obj[k];
      }
      return defaultValue;
    }

    function checkActiveSession() {
      const activeSession = sessionStorage.getItem('userSession');
      if (activeSession) {
        try {
          const currentUser = JSON.parse(activeSession);
          if (currentUser) {
            window.location.href = 'index.html';
          }
        } catch (e) {
          sessionStorage.removeItem('userSession');
        }
      }
    }

    async function handleAuthSubmit(event) {
      event.preventDefault();

      const usernameInput = document.getElementById('usernameInput').value.trim();
      const passwordInput = document.getElementById('passwordInput').value.trim();
      const errorBox = document.getElementById('errorBox');
      const btnSubmit = document.getElementById('btnLoginSubmit');

      errorBox.classList.add('hidden');
      errorBox.innerText = '';

      if (!usernameInput || !passwordInput) {
        showError("Please fill in both Company ID and Password.");
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<span>Authenticating...</span>`;

      const payload = {
        action: "login",
        COMPANY_ID: usernameInput,
        Password: passwordInput
      };

      try {
        const response = await fetch(AUTH_FLOW_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          const resultData = await response.json();
          
          // Verify user structure returned by Power Automate
          if (resultData && (resultData.NAME || resultData.COMPANY_ID || resultData.Title || resultData.status === "success")) {
            const userData = {
              NAME: getPropValue(resultData, ['NAME', 'Title', 'title', 'name'], usernameInput),
              COMPANY_ID: getPropValue(resultData, ['COMPANY_ID', 'company_id', 'Company_ID', 'ID', 'id', 'Username'], usernameInput),
              COMPANY: getPropValue(resultData, ['COMPANY', 'Company', 'company'], 'SPTS'),
              GROUP: getPropValue(resultData, ['GROUP', 'Group', 'group'], 'OPERATIONS'),
              Access: getPropValue(resultData, ['Access', 'access', 'ACCESS'], '0')
            };

            sessionStorage.setItem('userSession', JSON.stringify(userData));
            window.location.href = 'index.html';
          } else {
            showError("Invalid Company ID or Password. Please try again.");
          }
        } else {
          showError("Authentication service error. Please check your network or try again.");
        }
      } catch (err) {
        console.error("Auth Request Exception:", err);
        showError("Network connection error during authentication.");
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = `<span>Sign In</span>`;
      }
    }

    function showError(msg) {
      const errorBox = document.getElementById('errorBox');
      errorBox.innerText = msg;
      errorBox.classList.remove('hidden');
    }

    /* iOS PWA Helper Logic */
    function checkIosPrompt() {
      const isIos = /iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream;
      const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

      if (isIos && !isStandalone) {
        const dismissed = localStorage.getItem('iosPwaPromptDismissed');
        if (!dismissed) {
          document.getElementById('iosPrompt').classList.remove('hidden');
        }
      }
    }

    function dismissIosPrompt() {
      document.getElementById('iosPrompt').classList.add('hidden');
      localStorage.setItem('iosPwaPromptDismissed', 'true');
    }

    document.addEventListener('contextmenu', (e) => e.preventDefault());

    window.addEventListener('DOMContentLoaded', () => {
      checkActiveSession();
      checkIosPrompt();
    });
  </script>

  <!-- Global Full-Screen Trigger -->
  <script src="js/fullscreen-global.js"></script>
</body>
</html>
